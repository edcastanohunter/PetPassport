<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>PetPassport Partner API - Portal de Desarrolladores</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'><text y='20' font-size='20'>🐾</text></svg>">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
  <style>
    body {
      margin: 0;
      padding: 0;
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #0f172a;
      color: #f8fafc;
    }
    .top-banner {
      background: #1e293b;
      border-bottom: 1px solid #334155;
      padding: 12px 24px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .logo-container {
      display: flex;
      align-items: center;
      gap: 12px;
      font-weight: 700;
      font-size: 1.125rem;
    }
    .badge {
      background: #3b82f6;
      color: white;
      font-size: 0.75rem;
      font-weight: 600;
      padding: 2px 8px;
      border-radius: 9999px;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }
    .nav-links {
      display: flex;
      gap: 16px;
    }
    .nav-links a {
      color: #94a3b8;
      text-decoration: none;
      font-size: 0.875rem;
      font-weight: 500;
      transition: color 0.15s;
    }
    .nav-links a:hover {
      color: #38bdf8;
    }
  </style>
</head>
<body>
  <header class="top-banner">
    <div class="logo-container">
      <span>🐾 PetPassport Developer Hub</span>
      <span class="badge">Partner API v1</span>
    </div>
    <nav class="nav-links">
      <a href="auth.md" target="_blank">Autenticación OAuth2</a>
      <a href="webhooks.md" target="_blank">Guía de Webhooks</a>
      <a href="signature-vectors.md" target="_blank">Vectores de Firma</a>
      <a href="go-live-checklist.md" target="_blank">Checklist Go-Live</a>
      <a href="changelog.md" target="_blank">Changelog</a>
    </nav>
  </header>

  <!-- Scalar API Reference Interactive Explorer -->
  <div id="api-reference"></div>
  <script src="https://cdn.jsdelivr.net/npm/@scalar/api-reference"></script>
  <script>
    Scalar.mount('#api-reference', {
      spec: {
        url: './partner-v1.yaml',
      },
      theme: 'purple',
      layout: 'modern',
      showSidebar: true,
      darkMode: true,
    })
  </script>
</body>
</html>

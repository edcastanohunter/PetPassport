version: "2"
run:
  timeout: 5m
  build-tags: [integration]
linters:
  enable:
    - govet
    - errcheck
    - staticcheck
    - unused
    - ineffassign
    - gosec
    - depguard
    - bodyclose
    - noctx
    - revive
  settings:
    gosec:
      excludes:
        - G104 # errcheck lo cubre
    depguard:
      # Reglas de dependencia de ADR-001 (docs/phase-1/03-arquitectura.md §2).
      rules:
        domain-is-pure:
          files: ["**/internal/*/domain/**"]
          deny:
            - pkg: "github.com/edcastanohunter/petpassport/backend/internal/platform"
              desc: "domain no importa platform (ADR-001 §1)"
            - pkg: "github.com/jackc/pgx"
              desc: "domain no importa pgx (ADR-001 §1)"
            - pkg: "net/http"
              desc: "domain no importa net/http (ADR-001 §1)"
        app-no-infra:
          files: ["**/internal/*/app/**"]
          deny:
            - pkg: "github.com/edcastanohunter/petpassport/backend/internal/identity/infra"
            - pkg: "github.com/edcastanohunter/petpassport/backend/internal/identity/http"
            - pkg: "github.com/edcastanohunter/petpassport/backend/internal/partnernetwork/infra"
            - pkg: "github.com/edcastanohunter/petpassport/backend/internal/partnernetwork/http"
            - pkg: "github.com/edcastanohunter/petpassport/backend/internal/petregistry/infra"
            - pkg: "github.com/edcastanohunter/petpassport/backend/internal/petregistry/http"
            - pkg: "github.com/edcastanohunter/petpassport/backend/internal/clinical/infra"
            - pkg: "github.com/edcastanohunter/petpassport/backend/internal/clinical/http"
            - pkg: "github.com/edcastanohunter/petpassport/backend/internal/scheduling/infra"
            - pkg: "github.com/edcastanohunter/petpassport/backend/internal/scheduling/http"
            - pkg: "github.com/edcastanohunter/petpassport/backend/internal/notifications/infra"
            - pkg: "github.com/edcastanohunter/petpassport/backend/internal/notifications/http"
            - pkg: "github.com/jackc/pgx"
              desc: "app define puertos, no adaptadores (ADR-001 §2)"
        # ARQ-014 (PP-F2-ARQ-014): solo el worker abre SMTP. Los módulos y el api
        # encolan con platform/notify; nadie más importa platform/mail.
        smtp-only-in-worker:
          files:
            - "**/internal/**"
            - "**/cmd/api/**"
            - "!**/internal/platform/mail/**"
            - "!**/internal/notifications/infra/**"
          deny:
            - pkg: "github.com/edcastanohunter/petpassport/backend/internal/platform/mail"
              desc: "solo el worker envía correo (ARQ-014): encola con platform/notify"
        no-cross-context-domain:
          files: ["**/internal/identity/**"]
          deny:
            - pkg: "github.com/edcastanohunter/petpassport/backend/internal/partnernetwork/domain"
            - pkg: "github.com/edcastanohunter/petpassport/backend/internal/partnernetwork/infra"
            - pkg: "github.com/edcastanohunter/petpassport/backend/internal/petregistry/domain"
            - pkg: "github.com/edcastanohunter/petpassport/backend/internal/petregistry/infra"
        no-cross-context-domain-pn:
          files: ["**/internal/partnernetwork/**"]
          deny:
            - pkg: "github.com/edcastanohunter/petpassport/backend/internal/identity/domain"
            - pkg: "github.com/edcastanohunter/petpassport/backend/internal/identity/infra"
            - pkg: "github.com/edcastanohunter/petpassport/backend/internal/petregistry/domain"
            - pkg: "github.com/edcastanohunter/petpassport/backend/internal/petregistry/infra"
        no-cross-context-domain-pr:
          files: ["**/internal/petregistry/**"]
          deny:
            - pkg: "github.com/edcastanohunter/petpassport/backend/internal/identity/domain"
            - pkg: "github.com/edcastanohunter/petpassport/backend/internal/identity/infra"
            - pkg: "github.com/edcastanohunter/petpassport/backend/internal/partnernetwork/domain"
            - pkg: "github.com/edcastanohunter/petpassport/backend/internal/partnernetwork/infra"
        # F2 (PP-F2-DOM-002): los contextos se comunican por puertos y por el
        # JSON publicado de los eventos, nunca importando el dominio ajeno.
        no-cross-context-domain-cl:
          files: ["**/internal/clinical/**"]
          deny:
            - pkg: "github.com/edcastanohunter/petpassport/backend/internal/identity/domain"
            - pkg: "github.com/edcastanohunter/petpassport/backend/internal/identity/infra"
            - pkg: "github.com/edcastanohunter/petpassport/backend/internal/partnernetwork/domain"
            - pkg: "github.com/edcastanohunter/petpassport/backend/internal/partnernetwork/infra"
            - pkg: "github.com/edcastanohunter/petpassport/backend/internal/petregistry/domain"
            - pkg: "github.com/edcastanohunter/petpassport/backend/internal/petregistry/infra"
            - pkg: "github.com/edcastanohunter/petpassport/backend/internal/scheduling/domain"
            - pkg: "github.com/edcastanohunter/petpassport/backend/internal/scheduling/infra"
            - pkg: "github.com/edcastanohunter/petpassport/backend/internal/notifications/domain"
            - pkg: "github.com/edcastanohunter/petpassport/backend/internal/notifications/infra"
        # F2 (PP-F2-DOM-002): los contextos se comunican por puertos y por el
        # JSON publicado de los eventos, nunca importando el dominio ajeno.
        no-cross-context-domain-sc:
          files: ["**/internal/scheduling/**"]
          deny:
            - pkg: "github.com/edcastanohunter/petpassport/backend/internal/identity/domain"
            - pkg: "github.com/edcastanohunter/petpassport/backend/internal/identity/infra"
            - pkg: "github.com/edcastanohunter/petpassport/backend/internal/partnernetwork/domain"
            - pkg: "github.com/edcastanohunter/petpassport/backend/internal/partnernetwork/infra"
            - pkg: "github.com/edcastanohunter/petpassport/backend/internal/petregistry/domain"
            - pkg: "github.com/edcastanohunter/petpassport/backend/internal/petregistry/infra"
            - pkg: "github.com/edcastanohunter/petpassport/backend/internal/clinical/domain"
            - pkg: "github.com/edcastanohunter/petpassport/backend/internal/clinical/infra"
            - pkg: "github.com/edcastanohunter/petpassport/backend/internal/notifications/domain"
            - pkg: "github.com/edcastanohunter/petpassport/backend/internal/notifications/infra"
        # F2 (PP-F2-DOM-002): los contextos se comunican por puertos y por el
        # JSON publicado de los eventos, nunca importando el dominio ajeno.
        no-cross-context-domain-nt:
          files: ["**/internal/notifications/**"]
          deny:
            - pkg: "github.com/edcastanohunter/petpassport/backend/internal/identity/domain"
            - pkg: "github.com/edcastanohunter/petpassport/backend/internal/identity/infra"
            - pkg: "github.com/edcastanohunter/petpassport/backend/internal/partnernetwork/domain"
            - pkg: "github.com/edcastanohunter/petpassport/backend/internal/partnernetwork/infra"
            - pkg: "github.com/edcastanohunter/petpassport/backend/internal/petregistry/domain"
            - pkg: "github.com/edcastanohunter/petpassport/backend/internal/petregistry/infra"
            - pkg: "github.com/edcastanohunter/petpassport/backend/internal/clinical/domain"
            - pkg: "github.com/edcastanohunter/petpassport/backend/internal/clinical/infra"
            - pkg: "github.com/edcastanohunter/petpassport/backend/internal/scheduling/domain"
            - pkg: "github.com/edcastanohunter/petpassport/backend/internal/scheduling/infra"
        platform-has-no-business:
          files: ["**/internal/platform/**"]
          deny:
            - pkg: "github.com/edcastanohunter/petpassport/backend/internal/identity"
            - pkg: "github.com/edcastanohunter/petpassport/backend/internal/partnernetwork"
            - pkg: "github.com/edcastanohunter/petpassport/backend/internal/petregistry"
            - pkg: "github.com/edcastanohunter/petpassport/backend/internal/clinical"
            - pkg: "github.com/edcastanohunter/petpassport/backend/internal/scheduling"
            - pkg: "github.com/edcastanohunter/petpassport/backend/internal/notifications"
    revive:
      rules:
        - name: exported
          disabled: true
formatters:
  enable:
    - gofmt
    - goimports
  settings:
    goimports:
      local-prefixes:
        - github.com/edcastanohunter/petpassport

<p>{{if eq .V.status "verified"}}{{.V.org_name}} is now verified. You can receive care links from pet guardians.{{else if eq .V.status "rejected"}}We could not verify {{.V.org_name}}.{{else}}{{.V.org_name}} was suspended.{{end}}</p>

<p style="margin:24px 0"><a href="{{.V.link}}" style="background:#1d4ed8;color:#ffffff;padding:10px 18px;border-radius:6px;text-decoration:none;display:inline-block">Go to PetPassport</a></p>

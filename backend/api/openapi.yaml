    parameters:
      - $ref: "#/components/parameters/PetId"
    get:
      operationId: getPetSummary
      summary: Resumen de la ficha clínica
      description: Alertas, última consulta, próximas dosis (M2.2), peso actual y controles pendientes (PRD-009). Vista derivada (X-PP-Freshness).
      tags: [records]
      x-pp-action: record:read
      responses:
        "200":
          description: Resumen
          headers:
            X-PP-Freshness:
              $ref: "#/components/headers/X-PP-Freshness"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PetClinicalSummary"
        "401":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"
  /documents/{jobId}:
    parameters:
      - name: jobId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    get:
      operationId: getDocumentJob
      summary: Estado de un documento en generación
      description: Jobs de PDF encolados al firmar o adendar (API-013). Visible para quien puede leer el documento de origen.
      tags: [documents]
      x-pp-action: encounter:read
      responses:
        "200":
          description: Estado del job
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DocumentJob"
        "401":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"
  /verify/encounters/{encounterId}:
    parameters:
      - $ref: "#/components/parameters/EncounterId"
    get:
      operationId: verifyEncounter
      summary: Verificación pública de una consulta firmada
      description: Sin autenticación ni PII. Recomputa el hash desde es.events y lo compara con el firmado y con `hash` (SEC-004). Rate limit en el WAF; `X-Robots-Tag noindex`. Inexistente o sin firmar → 404.
      tags: [documents]
      security: []
      x-pp-action: public
      parameters:
        - name: hash
          in: query
          schema:
            type: string
            pattern: "^[0-9a-fA-F]{64}$"
      responses:
        "200":
          description: Resultado de la verificación
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EncounterVerification"
        "404":
          $ref: "#/components/responses/Problem"
        "422":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"
  /healthz:
    get:
      operationId: getHealthz
      summary: Liveness pública (usada por el WAF)
      description: Indica que el proceso responde. No comprueba dependencias (eso lo hace /readyz en el puerto interno).
      tags: [system]
      security: []
      x-pp-action: public
      responses:
        "200":
          description: El proceso está vivo
          headers:
            X-Correlation-ID:
              $ref: "#/components/headers/X-Correlation-ID"
            X-Request-ID:
              $ref: "#/components/headers/X-Request-ID"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
              examples:
                ok:
                  value: { status: ok }
        default:
          $ref: "#/components/responses/Problem"
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Access token emitido por Keycloak (realm `petpassport`, audiencia `petpassport-api`).
  parameters:
    EncounterId:
      name: encounterId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    AttachmentId:
      name: attachmentId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    Cursor:
      name: cursor
      in: query
      schema:
        type: string
        maxLength: 200
    Limit:
      name: limit
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
    PetId:
      name: petId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    OrgId:
      name: orgId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    OrganizationId:
      name: organizationId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    UserId:
      name: userId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    InvitationId:
      name: invitationId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    Token:
      name: token
      in: path
      required: true
      description: Token de un solo uso (32 bytes en base64url).
      schema:
        type: string
        minLength: 20
        maxLength: 64
        pattern: "^[A-Za-z0-9_-]+$"
    AcceptLink:
      name: Accept
      in: header
      required: false
      description: "Con `application/json` la descarga responde `200 DownloadLink` en lugar de `302` (clientes SPA que no pueden leer `Location` de una redirección con fetch)."
      schema:
        type: string
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: UUID que identifica el intento del usuario; repetida con el mismo cuerpo devuelve la respuesta original (ARQ-008).
      schema:
        type: string
        format: uuid
    IfMatch:
      name: If-Match
      in: header
      required: true
      description: Versión conocida del recurso (ETag de la última lectura).
      schema:
        type: integer
        format: int64
        minimum: 1
  headers:
    X-PP-Freshness:
      description: Retraso de la proyección derivada, `lag=<segundos>` (FE-014, API-013).
      schema:
        type: string
    ETag:
      description: Versión del recurso; enviar en If-Match para los comandos.
      schema:
        type: integer
        format: int64
    X-Correlation-ID:
      description: Identificador de correlación (UUID). Se acepta entrante y siempre se devuelve.
      schema:
        type: string
        format: uuid
    X-Request-ID:
      description: Identificador único del request.
      schema:
        type: string
        format: uuid
  examples:
    MeOnboarded:
      value:
        id: 0192f3a2-2222-7aaa-bbbb-dddddddddddd
        email: ana@example.com
        email_verified: true
        display_name: Ana Tutora
        locale: es
        country: CO
        phone: "+573001234567"
        address: null
        emergency_contact: null
        global_roles: [pet_owner]
        memberships: []
        onboarding_required: false
        consent:
          terms_version: 2026-10-draft
          privacy_version: 2026-10-draft
          accepted_at: 2026-10-20T10:00:00Z
        consent_outdated: false
        status: active
  schemas:
    DisplayName:
      type: string
      minLength: 1
      maxLength: 120
      pattern: "^[^\\x00-\\x08\\x0B\\x0C\\x0E-\\x1F]*$"
    CountryCode:
      type: string
      description: ISO 3166-1 alpha-2.
      pattern: "^[A-Za-z]{2}$"
    Locale:
      type: string
      enum: [es, en]
    Phone:
      type: string
      description: E.164; se aceptan espacios, guiones y paréntesis que se eliminan al normalizar.
      maxLength: 32
      pattern: "^\\+[0-9 ()\\-.]{6,30}$"
    ConsentVersion:
      type: string
      maxLength: 32
      pattern: "^[A-Za-z0-9.-]+$"
    Address:
      type: object
      additionalProperties: false
      required: [country, city, line1]
      properties:
        country:
          $ref: "#/components/schemas/CountryCode"
        region:
          type: string
          maxLength: 120
        city:
          type: string
          minLength: 1
          maxLength: 120
        line1:
          type: string
          minLength: 1
          maxLength: 200
        line2:
          type: string
          maxLength: 200
        postal_code:
          type: string
          maxLength: 20
    EmergencyContact:
      type: object
      additionalProperties: false
      required: [name, phone]
      properties:
        name:
          $ref: "#/components/schemas/DisplayName"
        phone:
          $ref: "#/components/schemas/Phone"
        relationship:
          type: string
          maxLength: 60
    Consent:
      type: object
      additionalProperties: false
      required: [terms_version, privacy_version, accepted_at]
      properties:
        terms_version:
          type: string
        privacy_version:
          type: string
        accepted_at:
          type: string
          format: date-time
    PetName:
      type: string
      description: 1–60 caracteres; letras/espacios/'/-; sin control. Se recortan espacios y se colapsan.
      minLength: 1
      maxLength: 60
      pattern: "^[^\\x00-\\x08\\x0B\\x0C\\x0E-\\x1F]*$"
    Breed:
      type: string
      description: Texto libre en F1 (catálogo en F2).
      minLength: 1
      maxLength: 80
    Markings:
      type: string
      description: Color / señas particulares.
      maxLength: 200
    Species:
      type: string
      enum: [dog, cat, bird, rabbit, reptile, rodent, equine, ferret, fish, other]
      x-enum-varnames: [Dog, Cat, Bird, Rabbit, Reptile, Rodent, Equine, Ferret, Fish, Other]
    SpeciesOther:
      type: string
      description: Obligatoria si species = other; 1–40.
      minLength: 1
      maxLength: 40
    Sex:
      type: string
      enum: [male, female, unknown]
    Neutered:
      type: string
      enum: ["yes", "no", "unknown"]
    BirthDate:
      type: object
      additionalProperties: false
      required: [date, approximate]
      properties:
        date:
          type: string
          description: Fecha civil YYYY-MM-DD; ≤ hoy y ≥ hoy − 40 años.
          format: date
        approximate:
          type: boolean
    Microchip:
      type: string
      description: ISO 11784/11785 (15 dígitos) o legado (9/10 alfanuméricos). Se normaliza (sin espacios/guiones, mayúsculas).
      minLength: 9
      maxLength: 15
      pattern: "^([0-9]{15}|[A-Z0-9]{9,10})$"
    Photo:
      type: object
      additionalProperties: false
      required: [url, thumb_url, expires_at]

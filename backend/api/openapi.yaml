          type: [string, "null"]
        global_roles:
          type: array
          maxItems: 20
          items:
            type: string
        created_at:
          type: string
          format: date-time
        last_login_at:
          oneOf:
            - type: string
              format: date-time
            - type: "null"
        pet_count:
          type: integer
        memberships:
          type: array
          maxItems: 100
          items:
            $ref: "#/components/schemas/Membership"
    AdminUserPage:
      type: object
      additionalProperties: false
      required: [data, next_cursor]
      properties:
        data:
          type: array
          maxItems: 100
          items:
            $ref: "#/components/schemas/AdminUserRow"
        next_cursor:
          oneOf:
            - type: string
            - type: "null"
    AuditEntry:
      type: object
      additionalProperties: false
      required: [id, occurred_at, actor_id, actor_roles, action, target_type, target_id, reason, correlation_id]
      properties:
        id:
          type: string
          format: uuid
        occurred_at:
          type: string
          format: date-time
        actor_id:
          oneOf:
            - type: string
              format: uuid
            - type: "null"
        actor_roles:
          type: array
          items:
            type: string
        action:
          type: string
        target_type:
          type: [string, "null"]
        target_id:
          oneOf:
            - type: string
              format: uuid
            - type: "null"
        reason:
          type: [string, "null"]
        details:
          type: object
          description: Detalles sin PII en claro (nombres de campos, versiones, estados).
          additionalProperties: true
        correlation_id:
          oneOf:
            - type: string
              format: uuid
            - type: "null"
    AuditPage:
      type: object
      additionalProperties: false
      required: [data, next_cursor]
      properties:
        data:
          type: array
          maxItems: 100
          items:
            $ref: "#/components/schemas/AuditEntry"
        next_cursor:
          oneOf:
            - type: string
            - type: "null"
    HealthStatus:
      type: object
      additionalProperties: false
      required: [status]
      properties:
        status:
          type: string
          enum: [ok]
    Problem:
      description: Error en formato application/problem+json (RFC 9457) con código estable del catálogo.
      type: object
      additionalProperties: false
      required: [type, title, status, code]
      properties:
        type:
          type: string
          format: uri
        title:
          type: string
        status:
          type: integer
          minimum: 400
          maximum: 599
        code:
          type: string
          description: Código del catálogo (docs/phase-1/05-api.md §5).
          pattern: "^[A-Z_]+$"
        detail:
          type: string
        instance:
          type: string
        correlation_id:
          type: string
          format: uuid
        errors:
          type: array
          maxItems: 100
          items:
            type: object
            additionalProperties: false
            required: [field, code]
            properties:
              field:
                type: string
              code:
                type: string
    EncounterType:
      type: string
      enum: [consultation, follow_up, emergency, vaccination, surgery, procedure, other]
      x-enum-varnames: [EncounterTypeConsultation, EncounterTypeFollowUp, EncounterTypeEmergency, EncounterTypeVaccination, EncounterTypeSurgery, EncounterTypeProcedure, EncounterTypeOther]
    AddendumReason:
      type: string
      enum: [correction, additional_findings, lab_results, other]
      x-enum-varnames: [AddendumCorrection, AddendumAdditionalFindings, AddendumLabResults, AddendumOther]
    EncounterStatus:
      type: string
      enum: [draft, signed, discarded]
    OpenEncounterRequest:
      type: object
      additionalProperties: false
      required: [pet_id, type, reason]
      properties:
        pet_id:
          type: string
          format: uuid
        type:
          $ref: "#/components/schemas/EncounterType"
        reason:
          type: string
          minLength: 1
          maxLength: 300
        started_at:
          type: string
          format: date-time
        attending_vet_id:
          type: string
          format: uuid
        appointment_id:
          type: string
          format: uuid
    UpdateEncounterRequest:
      type: object
      additionalProperties: false
      properties:
        type:
          $ref: "#/components/schemas/EncounterType"
        reason:
          type: string
          minLength: 1
          maxLength: 300
        started_at:
          type: string
          format: date-time
        attending_vet_id:
          type: string
          format: uuid
        subjective:
          type: string
          maxLength: 5000
        objective:
          $ref: "#/components/schemas/Objective"
    Vitals:
      type: object
      additionalProperties: false
      properties:
        weight_kg:
          type: number
          minimum: 0.01
          maximum: 500
        temp_c:
          type: number
          minimum: 30
          maximum: 45
        heart_rate_bpm:
          type: integer
          minimum: 20
          maximum: 400
        resp_rate_rpm:
          type: integer
          minimum: 5
          maximum: 200
        body_condition:
          type: integer
          minimum: 1
          maximum: 9
        mucosa:
          type: string
          enum: [pink, pale, white, cyanotic, icteric, hyperemic]
        crt_seconds:
          type: number
          minimum: 0.5
          maximum: 5
        hydration_pct:
          type: number
          minimum: 0
          maximum: 15
    VitalWarning:
      type: object
      required: [field, code, message]
      properties:
        field:
          type: string
        code:
          type: string
          enum: [LOW, HIGH]
        message:
          type: string
    Finding:
      type: object
      additionalProperties: false
      required: [status]
      properties:
        status:
          type: string
          enum: [normal, abnormal, not_examined]
        note:
          type: string
          maxLength: 500
    Objective:
      type: object
      additionalProperties: false
      properties:
        narrative:
          type: string
          maxLength: 5000
        systems:
          type: object
          description: "Hallazgos por sistema: integumentary, musculoskeletal, cardiovascular, respiratory, digestive, genitourinary, nervous, eyes, ears, lymph, oral."
          additionalProperties:
            $ref: "#/components/schemas/Finding"
    Diagnosis:
      type: object
      additionalProperties: false
      required: [text, certainty]
      properties:
        text:
          type: string
          minLength: 1
          maxLength: 200
        code:
          type: object
          additionalProperties: false
          required: [system, value]
          properties:
            system:
              type: string
              maxLength: 40
            value:
              type: string
              maxLength: 40
        certainty:
          type: string
          enum: [presumptive, confirmed, differential, ruled_out]
    DiagnosesRequest:
      type: object
      additionalProperties: false
      required: [diagnoses]
      properties:
        diagnoses:
          type: array
          maxItems: 20
          items:
            $ref: "#/components/schemas/Diagnosis"
    Frequency:
      type: object
      additionalProperties: false
      properties:
        once:
          type: boolean
        every:
          type: integer
          minimum: 1
          maximum: 90
        unit:
          type: string
          enum: [hours, days]
    MedicationItem:
      type: object
      additionalProperties: false
      required: [medication_name, dose, dose_unit, route, frequency]
      properties:
        medication_name:
          type: string
          minLength: 1
          maxLength: 120
        presentation:
          type: string
          maxLength: 120
        dose:
          type: number
          exclusiveMinimum: 0
        dose_unit:
          type: string
          enum: [mg, ml, ui, tablet, capsule, drop, mg_per_kg, ml_per_kg]
        route:
          type: string
          enum: [oral, sc, im, iv, topical, ophthalmic, otic, inhaled, rectal]
        frequency:
          $ref: "#/components/schemas/Frequency"
        duration_days:
          type: integer
          minimum: 1
          maximum: 365
        instructions:
          type: string
          maxLength: 300
    Procedure:
      type: object
      additionalProperties: false
      required: [name]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 120
        notes:
          type: string
          maxLength: 1000
    Plan:
      type: object
      additionalProperties: false
      properties:
        medications:
          type: array
          maxItems: 30
          items:
            $ref: "#/components/schemas/MedicationItem"
        procedures:
          type: array
          maxItems: 20
          items:
            $ref: "#/components/schemas/Procedure"
        recommendations:
          type: string
          maxLength: 5000
    FollowUp:
      type: object
      additionalProperties: false
      required: [due_date, reason]
      properties:
        due_date:
          type: string
          format: date
        reason:
          type: string
          minLength: 1
          maxLength: 200
    Attachment:
      type: object
      required: [id, content_type, size, visible_to_guardian, created_at]
      properties:
        id:
          type: string
          format: uuid
        content_type:
          type: string
          enum: [jpeg, png, webp, pdf]
        size:
          type: integer
        description:
          type: string
        visible_to_guardian:
          type: boolean
        addendum_seq:
          type: integer
        pending_addendum:
          type: boolean
          description: Subido a una consulta firmada; se adjunta con la siguiente adenda.
        created_at:
          type: string
          format: date-time
    AttachmentVisibilityRequest:
      type: object
      additionalProperties: false
      required: [visible_to_guardian]
      properties:
        visible_to_guardian:
          type: boolean
        reason:
          type: string
          maxLength: 200
    UserRef:
      type: object
      required: [id, display_name]
      properties:
        id:
          type: string
          format: uuid
        display_name:
          type: string
    Signature:
      type: object
      required: [signed_by, signed_at, stream_version, content_hash]
      properties:
        signed_by:
          $ref: "#/components/schemas/UserRef"
        signed_at:
          type: string
          format: date-time
        stream_version:
          type: integer
          format: int64
        content_hash:
          type: string
          description: SHA-256 en hex del JSON canónico (RFC 8785) de los eventos hasta stream_version (ARQ-010).
        jws:
          type: string
          description: Reservado para la firma criptográfica del servidor (F5, SEC-004).
    Addendum:
      type: object
      required: [seq, text, reason, signed_by, signed_at, attachments]
      properties:
        seq:
          type: integer
        text:
          type: string
        reason:
          $ref: "#/components/schemas/AddendumReason"
        signed_by:
          $ref: "#/components/schemas/UserRef"
        signed_at:
          type: string
          format: date-time
        attachments:
          type: array
          items:
            $ref: "#/components/schemas/Attachment"
    AddendumRequest:
      type: object
      additionalProperties: false
      required: [text, reason]
      properties:
        text:
          type: string
          minLength: 1
          maxLength: 5000
        reason:
          $ref: "#/components/schemas/AddendumReason"
        attachment_ids:
          type: array
          maxItems: 5
          items:
            type: string
            format: uuid
    ReasonRequest:
      type: object
      additionalProperties: false
      required: [reason]
      properties:
        reason:
          type: string
          minLength: 1
          maxLength: 300
    DownloadLink:
      type: object
      required: [url, expires_at]
      properties:
        url:
          type: string
        expires_at:
          type: string
          format: date-time
    DocumentJob:
      type: object
      required: [id, status]
      properties:
        id:
          type: string
          format: uuid
        status:
          type: string
          enum: [pending, rendering, ready, failed]
        url:
          type: string
        expires_at:
          type: string
          format: date-time
    EncounterPdf:
      type: object
      required: [status]
      properties:
        status:
          type: string
          enum: [none, pending, rendering, ready, failed]
        job_id:
          type: string
          format: uuid
        version:
          type: integer
        url:
          type: string
        expires_at:
          type: string
          format: date-time
    PetRef:
      type: object
      required: [id, name, species]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        species:
          type: string
    Encounter:
      type: object
      required: [id, version, pet, organization_id, type, status, started_at, reason, diagnoses, plan, attachments, addenda, created_at, updated_at]
      properties:
        id:
          type: string
          format: uuid
        version:
          type: integer
          format: int64
        pet:
          $ref: "#/components/schemas/PetRef"
        organization_id:
          type: string
          format: uuid
        appointment_id:
          type: string
          format: uuid
        type:
          $ref: "#/components/schemas/EncounterType"
        status:
          $ref: "#/components/schemas/EncounterStatus"
        abandoned:
          type: boolean
        started_at:
          type: string
          format: date-time
        reason:
          type: string
        attending_vet:
          $ref: "#/components/schemas/UserRef"
        vitals:
          $ref: "#/components/schemas/Vitals"
        subjective:
          type: string
        objective:
          $ref: "#/components/schemas/Objective"
        diagnoses:
          type: array
          items:
            $ref: "#/components/schemas/Diagnosis"
        plan:
          $ref: "#/components/schemas/Plan"
        follow_up:
          $ref: "#/components/schemas/FollowUp"
        attachments:
          type: array
          items:
            $ref: "#/components/schemas/Attachment"
        signature:
          $ref: "#/components/schemas/Signature"
        addenda:
          type: array
          items:
            $ref: "#/components/schemas/Addendum"
        pdf:
          $ref: "#/components/schemas/EncounterPdf"
        warnings:
          type: array
          description: Avisos de rango por especie de las constantes (solo en PUT /vitals y lecturas clínicas).
          items:
            $ref: "#/components/schemas/VitalWarning"
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    EncounterSummary:
      type: object
      required: [id, version, pet, organization_id, type, status, started_at, reason, abandoned, last_activity_at]
      properties:
        id:
          type: string
          format: uuid
        version:
          type: integer
          format: int64
        pet:
          $ref: "#/components/schemas/PetRef"
        organization_id:
          type: string
          format: uuid
        type:
          $ref: "#/components/schemas/EncounterType"
        status:
          $ref: "#/components/schemas/EncounterStatus"
        started_at:
          type: string
          format: date-time
        reason:
          type: string
        attending_vet_id:
          type: string
          format: uuid
        attending_vet_name:
          type: string
        organization_name:
          type: string
        diagnoses:
          type: array
          description: Textos de diagnóstico (tarjetas del historial, FE-009).
          items:
            type: string
        addenda_count:
          type: integer
        signed_at:
          type: string
          format: date-time
        abandoned:
          type: boolean
        last_activity_at:
          type: string
          format: date-time
    EncounterPage:
      type: object
      required: [data]
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/EncounterSummary"
        next_cursor:
          type: string
    Freshness:
      type: object
      required: [lag_seconds]
      properties:
        lag_seconds:
          type: number
    TimelineItem:
      type: object
      required: [occurred_at, kind, ref_id, title, visibility]
      properties:
        occurred_at:
          type: string
          format: date-time
        kind:
          type: string
          enum: [encounter, addendum, vaccine, preventive, appointment, guardianship, care_link]
        ref_id:
          type: string
          format: uuid
        organization_id:
          type: string
          format: uuid
        title:
          type: string
          description: Clave estable traducible (p. ej. encounter.signed).
        summary:
          type: string
        visibility:
          type: string
          enum: [guardian, org, both]
    TimelinePage:
      type: object
      required: [data, freshness]
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/TimelineItem"
        next_cursor:
          type: string
        freshness:
          $ref: "#/components/schemas/Freshness"
    WeightPoint:
      type: object
      required: [measured_at, weight_kg, source]
      properties:
        measured_at:
          type: string
          format: date-time
        weight_kg:
          type: number
        source:
          type: string
          enum: [encounter, vaccination]
        organization_id:
          type: string
          format: uuid
    WeightHistory:
      type: object
      required: [data, trend, freshness]
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/WeightPoint"
        trend:
          type: object
          required: [window_days, alert]
          properties:
            delta_kg:
              type: number
            delta_pct:
              type: number
            window_days:
              type: integer
            alert:
              type: boolean
        freshness:
          $ref: "#/components/schemas/Freshness"
    FollowUpItem:
      type: object
      required: [encounter_id, organization_id, due_date, reason]
      properties:
        encounter_id:
          type: string
          format: uuid
        organization_id:
          type: string
          format: uuid
        due_date:
          type: string
          format: date
        reason:
          type: string
    PetClinicalSummary:
      type: object
      required: [alerts, next_due, open_follow_ups, freshness]
      properties:
        alerts:
          type: array
          items:
            type: string
        last_encounter:
          $ref: "#/components/schemas/EncounterSummary"
        next_due:
          type: array
          description: Próximas dosis del carnet (llegan con VaccinationCard, M2.2).
          items:
            type: object
        current_weight:
          $ref: "#/components/schemas/WeightPoint"
        open_follow_ups:
          type: array
          items:
            $ref: "#/components/schemas/FollowUpItem"
        access:
          type: string
          enum: [guardian, linked, custody, admin]
          description: Nivel de acceso del actor; `custody` muestra el banner "Acceso limitado a sus propias consultas" (FE-005).
        freshness:
          $ref: "#/components/schemas/Freshness"
    EncounterVerification:
      type: object
      required: [valid, signed_at, stream_version]
      properties:
        valid:
          type: boolean
          description: El hash recomputado coincide con el firmado y, si se envía, con `hash`.
        signed_at:
          type: string
          format: date-time
        stream_version:
          type: integer
          format: int64
        content_hash:
          type: string
          description: Solo se devuelve si la verificación es válida.
        organization_name:
          type: string
  responses:
    EncounterOK:
      description: Consulta actualizada
      headers:
        ETag:
          $ref: "#/components/headers/ETag"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Encounter"
    EncounterCreated:
      description: Adenda creada; devuelve la consulta
      headers:
        ETag:
          $ref: "#/components/headers/ETag"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Encounter"
    Problem:
      description: Error
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"

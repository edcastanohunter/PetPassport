          type: integer
          minimum: 0
        min_interval_days:
          type: integer
          minimum: 0
    Protocol:
      type: object
      required: [id, country, species, vaccine_id, initial_series, active]
      properties:
        id:
          type: string
          format: uuid
        country:
          type: string
        species:
          type: string
        vaccine_id:
          type: string
          format: uuid
        initial_series:
          type: array
          items:
            $ref: "#/components/schemas/SeriesDose"
        booster_interval_months:
          type: integer
          nullable: true
        legal_validity_months:
          type: integer
          nullable: true
        notes:
          type: string
        active:
          type: boolean
    ProtocolList:
      type: object
      required: [data]
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/Protocol"
    ProtocolWriteRequest:
      type: object
      required: [country, species, vaccine_id, initial_series, reason]
      properties:
        country:
          type: string
          pattern: "^[A-Z]{2}$"
        species:
          type: string
        vaccine_id:
          type: string
          format: uuid
        initial_series:
          type: array
          items:
            $ref: "#/components/schemas/SeriesDose"
        booster_interval_months:
          type: integer
          minimum: 1
        legal_validity_months:
          type: integer
          minimum: 1
        notes:
          type: string
          maxLength: 300
        reason:
          type: string
          minLength: 1
          maxLength: 300
    CreateShareRequest:
      type: object
      required: [scope, expires_in_days]
      properties:
        scope:
          type: string
          enum: [vaccination_card, full_record]
        expires_in_days:
          type: integer
          minimum: 1
          maximum: 90
        pin:
          type: string
          pattern: "^[0-9]{4,6}$"
    CreatedShare:
      type: object
      required: [id, url, expires_at]
      properties:
        id:
          type: string
          format: uuid
        url:
          type: string
        expires_at:
          type: string
          format: date-time
    Share:
      type: object
      required: [id, scope, has_pin, expires_at, created_at, access_count]
      properties:
        id:
          type: string
          format: uuid
        scope:
          type: string
          enum: [vaccination_card, full_record]
        has_pin:
          type: boolean
        expires_at:
          type: string
          format: date-time
        created_at:
          type: string
          format: date-time
        access_count:
          type: integer
        last_access_at:
          type: string
          format: date-time
          nullable: true
    ShareList:
      type: object
      required: [data]
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/Share"
    UnlockShareRequest:
      type: object
      required: [pin]
      properties:
        pin:
          type: string
          pattern: "^[0-9]{4,6}$"
    UnlockedShare:
      type: object
      required: [token, expires_at]
      properties:
        token:
          type: string
        expires_at:
          type: string
          format: date-time
    SharedPet:
      type: object
      required: [name, species, sex]
      properties:
        name:
          type: string
        species:
          type: string
        breed:
          type: string
          nullable: true
        sex:
          type: string
        birth_date:
          type: string
          format: date
          nullable: true
        microchip_masked:
          type: string
          nullable: true
    SharedRecord:
      type: object
      required: [scope, pet, card, verified_at]
      properties:
        scope:
          type: string
          enum: [vaccination_card, full_record]
        pet:
          $ref: "#/components/schemas/SharedPet"
        card:
          $ref: "#/components/schemas/Card"
        verified_at:
          type: string
          format: date-time
    CardVerification:
      type: object
      required: [valid, entries]
      properties:
        valid:
          type: boolean
        entries:
          type: integer
        verified_at:
          type: string
          format: date-time
    AppointmentType:
      type: string
      enum: [consultation, follow_up, vaccination, surgery, procedure, other]
    AppointmentStatus:
      type: string
      enum: [requested, proposed, confirmed, checked_in, completed, cancelled, no_show, rejected]
    SlotPreference:
      type: object
      description: Franja exacta (`start`+`end`) o rango de fechas locales (`date_from`+`date_to`).
      properties:
        start:
          type: string
          format: date-time
        end:
          type: string
          format: date-time
        date_from:
          type: string
          pattern: "^\\d{4}-\\d{2}-\\d{2}$"
        date_to:
          type: string
          pattern: "^\\d{4}-\\d{2}-\\d{2}$"
    AppointmentTransition:
      type: object
      required: [status, at]
      properties:
        status:
          $ref: "#/components/schemas/AppointmentStatus"
        at:
          type: string
          format: date-time
        by:
          type: string
        note:
          type: string
    AppointmentCancellation:
      type: object
      required: [by, late]
      properties:
        by:
          type: string
          enum: [guardian, clinic]
        reason:
          type: string
        late:
          type: boolean
    Appointment:
      type: object
      required: [id, version, pet_id, organization_id, type, origin, status, preferences, history, created_at, updated_at]
      properties:
        id:
          type: string
          format: uuid
        version:
          type: integer
          format: int64
        pet_id:
          type: string
          format: uuid
        pet_name:
          type: string
        pet_species:
          type: string
        organization_id:
          type: string
          format: uuid
        organization_name:
          type: string
        professional_id:
          type: [string, "null"]
          format: uuid
        professional_name:
          type: string
        type:
          $ref: "#/components/schemas/AppointmentType"
        origin:
          type: string
          enum: [guardian, clinic]
        status:
          $ref: "#/components/schemas/AppointmentStatus"
        reason:
          type: string
        preferences:
          type: array
          items:
            $ref: "#/components/schemas/SlotPreference"
        start:
          type: [string, "null"]
          format: date-time
        end:
          type: [string, "null"]
          format: date-time
        time_zone:
          type: string
        proposal_expires_at:
          type: [string, "null"]
          format: date-time
        encounter_id:
          type: [string, "null"]
          format: uuid
        cancellation:
          oneOf:
            - $ref: "#/components/schemas/AppointmentCancellation"
            - type: "null"
        cancellation_policy_hours:
          type: integer
        history:
          type: array
          items:
            $ref: "#/components/schemas/AppointmentTransition"
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    AppointmentPage:
      type: object
      required: [data]
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/Appointment"
        next_cursor:
          type: string
    RequestAppointmentRequest:
      type: object
      required: [pet_id, organization_id, type]
      properties:
        pet_id:
          type: string
          format: uuid
        organization_id:
          type: string
          format: uuid
        type:
          $ref: "#/components/schemas/AppointmentType"
        reason:
          type: string
          maxLength: 300
        preferences:
          type: array
          maxItems: 3
          items:
            $ref: "#/components/schemas/SlotPreference"
    CreateAppointmentRequest:
      type: object
      required: [pet_id, professional_id, type, start, end]
      properties:
        pet_id:
          type: string
          format: uuid
        professional_id:
          type: string
          format: uuid
        type:
          $ref: "#/components/schemas/AppointmentType"
        reason:
          type: string
          maxLength: 300
        start:
          type: string
          format: date-time
        end:
          type: string
          format: date-time
    AppointmentSlotRequest:
      type: object
      required: [start, end]
      properties:
        professional_id:
          type: string
          format: uuid
          description: Obligatorio al confirmar y proponer; al reprogramar, si se omite se mantiene el profesional.
        start:
          type: string
          format: date-time
        end:
          type: string
          format: date-time
    AppointmentReasonRequest:
      type: object
      properties:
        reason:
          type: string
          maxLength: 300
    AgendaTimeRange:
      type: object
      required: [start, end]
      properties:
        start:
          type: string
          pattern: "^\\d{2}:\\d{2}$"
        end:
          type: string
          pattern: "^\\d{2}:\\d{2}$"
    AgendaDayException:
      type: object
      required: [closed]
      properties:
        closed:
          type: boolean
        ranges:
          type: array
          items:
            $ref: "#/components/schemas/AgendaTimeRange"
    Agenda:
      type: object
      required: [organization_id, professional_id, defined, active, version]
      properties:
        organization_id:
          type: string
          format: uuid
        professional_id:
          type: string
          format: uuid
        professional_name:
          type: string
        defined:
          type: boolean
          description: "`false` para un veterinario activo sin agenda todavía."
        active:
          type: boolean
        version:
          type: integer
          format: int64
        time_zone:
          type: string
        weekly_template:
          type: object
          description: "Claves `mon`…`sun`."
          additionalProperties:
            type: array
            items:
              $ref: "#/components/schemas/AgendaTimeRange"
        slot_minutes:
          type: object
          description: Duración de franja por tipo de cita (5–480).
          additionalProperties:
            type: integer
        lead_time_min_hours:
          type: integer
        lead_time_max_days:
          type: integer
        cancellation_policy_hours:
          type: integer
        exceptions:
          type: object
          description: Excepciones por fecha local `YYYY-MM-DD`.
          additionalProperties:
            $ref: "#/components/schemas/AgendaDayException"
    AgendaList:
      type: object
      required: [data]
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/Agenda"
    PutAgendaRequest:
      type: object
      required: [weekly_template, slot_minutes, lead_time_min_hours, lead_time_max_days, cancellation_policy_hours]
      properties:
        time_zone:
          type: string
          description: IANA. Solo se usa al crear la agenda.
        weekly_template:
          type: object
          additionalProperties:
            type: array
            items:
              $ref: "#/components/schemas/AgendaTimeRange"
        slot_minutes:
          type: object
          additionalProperties:
            type: integer
        lead_time_min_hours:
          type: integer
          minimum: 0
        lead_time_max_days:
          type: integer
          minimum: 1
        cancellation_policy_hours:
          type: integer
          minimum: 0
        active:
          type: boolean
          default: true
    AddAgendaExceptionRequest:
      type: object
      required: [date, closed]
      properties:
        date:
          type: string
          pattern: "^\\d{4}-\\d{2}-\\d{2}$"
        closed:
          type: boolean
        ranges:
          type: array
          items:
            $ref: "#/components/schemas/AgendaTimeRange"
    AvailabilitySlot:
      type: object
      required: [professional_id, start, end]
      properties:
        professional_id:
          type: string
          format: uuid
        start:
          type: string
          format: date-time
        end:
          type: string
          format: date-time
    AvailabilityList:
      type: object
      required: [data]
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/AvailabilitySlot"
  responses:
    EncounterOK:
      description: Consulta actualizada
      headers:
        ETag:
          $ref: "#/components/headers/ETag"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Encounter"
    EncounterCreated:
      description: Adenda creada; devuelve la consulta
      headers:
        ETag:
          $ref: "#/components/headers/ETag"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Encounter"
    Problem:
      description: Error
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    AppointmentOK:
      description: Cita
      headers:
        ETag:
          $ref: "#/components/headers/ETag"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Appointment"
    AppointmentCreated:
      description: Cita creada
      headers:
        ETag:
          $ref: "#/components/headers/ETag"
        Location:
          schema:
            type: string
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Appointment"
    AgendaOK:
      description: Agenda
      headers:
        ETag:
          $ref: "#/components/headers/ETag"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Agenda"

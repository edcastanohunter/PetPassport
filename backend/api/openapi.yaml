        - name: organization_id
          in: query
          schema:
            type: string
            format: uuid
        - name: from
          in: query
          schema:
            type: string
            format: date-time
        - name: to
          in: query
          schema:
            type: string
            format: date-time
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: Página de la línea de tiempo
          headers:
            X-PP-Freshness:
              $ref: "#/components/headers/X-PP-Freshness"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TimelinePage"
        "401":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        "422":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"
  /pets/{petId}/encounters:

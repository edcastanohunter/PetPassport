  /encounters/{encounterId}/pdf:
    parameters:
      - $ref: "#/components/parameters/EncounterId"
    get:
      operationId: getEncounterPdf
      summary: PDF de la consulta firmada
      description: 302 a URL prefirmada (15 min) del PDF vigente (última adenda incluida) o 202 con el job si aún se genera (DOCUMENT_PENDING, ARQ-010).
      tags: [encounters]
      x-pp-action: encounter:read
      parameters:
        - $ref: "#/components/parameters/AcceptLink"
      responses:
        "200":
          description: "URL prefirmada del PDF (con `Accept: application/json`)"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DownloadLink"
        "202":
          description: PDF en generación
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DocumentJob"
        "302":
          description: Redirección a la URL prefirmada
          headers:
            Location:
              schema:
                type: string
        "401":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"
  /encounters/{encounterId}/attachments:
    parameters:
      - $ref: "#/components/parameters/EncounterId"
    post:
      operationId: uploadEncounterAttachment
      summary: Subir adjunto
      description: JPEG/PNG/WebP (re-encode, EXIF sin GPS) o PDF validado (sin JavaScript, formularios ni adjuntos embebidos, ≤ 50 páginas), ≤ 10 MB (SEC-003). En borrador se añade al cuerpo (≤ 10, 409 ATTACHMENT_LIMIT); en una consulta firmada queda preparado para la siguiente adenda (solo el responsable).
      tags: [encounters]
      x-pp-action: encounter:edit
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              additionalProperties: false
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
                description:
                  type: string
                  maxLength: 200
                visible_to_guardian:
                  type: boolean
                  default: true
      responses:
        "201":
          description: Adjunto subido
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Attachment"
        "401":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        "409":
          $ref: "#/components/responses/Problem"
        "413":
          $ref: "#/components/responses/Problem"
        "415":
          $ref: "#/components/responses/Problem"
        "422":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"
  /encounters/{encounterId}/attachments/{attachmentId}:
    parameters:
      - $ref: "#/components/parameters/EncounterId"
      - $ref: "#/components/parameters/AttachmentId"
    get:
      operationId: getEncounterAttachment
      summary: Descargar adjunto
      description: 302 a URL prefirmada (15 min, PDF con Content-Disposition attachment). El tutor solo ve adjuntos `visible_to_guardian` de consultas firmadas. Descarga auditada (SEC-005).
      tags: [encounters]
      x-pp-action: encounter:read
      parameters:
        - $ref: "#/components/parameters/AcceptLink"
      responses:
        "200":
          description: "URL prefirmada (con `Accept: application/json`)"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DownloadLink"
        "302":
          description: Redirección a la URL prefirmada
          headers:
            Location:
              schema:
                type: string
        "401":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"
    patch:
      operationId: setEncounterAttachmentVisibility
      summary: Cambiar visibilidad para el tutor
      description: Solo veterinario de la organización, en cualquier estado; ocultar exige motivo (auditado, SEC-003).
      tags: [encounters]
      x-pp-action: encounter:clinical_edit
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AttachmentVisibilityRequest"
      responses:
        "200":
          description: Adjunto actualizado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Attachment"
        "401":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        "409":
          $ref: "#/components/responses/Problem"
        "422":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"
    delete:
      operationId: deleteEncounterAttachment
      summary: Eliminar adjunto
      description: Solo en borrador (PRD-004).
      tags: [encounters]
      x-pp-action: encounter:edit
      responses:
        "204":
          description: Eliminado
        "401":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        "409":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"
  /pets/{petId}/timeline:

          $ref: "#/components/responses/EncounterOK"
        "401":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        "409":
          $ref: "#/components/responses/Problem"
        "422":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"
  /encounters/{encounterId}/diagnoses:
    parameters:
      - $ref: "#/components/parameters/EncounterId"
    put:

      description: Visibles para el actor (custodia incluida; RN-10). La clínica con vínculo ve también sus borradores.
      tags: [records]
      x-pp-action: record:read
      parameters:
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: Página de consultas
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EncounterPage"
        "401":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"
  /pets/{petId}/weight-history:
    parameters:
      - $ref: "#/components/parameters/PetId"
    get:
      operationId: getPetWeightHistory
      summary: Historial de peso con tendencia
      description: Mediciones de consultas firmadas y tendencia; alerta si la variación supera el 10 % en 90 días (PRD-025). Vista derivada (X-PP-Freshness).
      tags: [records]
      x-pp-action: record:read
      responses:
        "200":
          description: Historial de peso
          headers:
            X-PP-Freshness:
              $ref: "#/components/headers/X-PP-Freshness"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WeightHistory"
        "401":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"

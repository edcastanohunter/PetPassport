          application/json:
            schema:
              $ref: "#/components/schemas/RequestAppointmentRequest"
      responses:
        "201":
          $ref: "#/components/responses/AppointmentCreated"
        "401":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        "409":
          $ref: "#/components/responses/Problem"
        "422":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"
    get:
      operationId: listMyAppointments
      summary: Mis citas
      description: Citas de las mascotas del tutor autenticado, más recientes primero.
      tags: [appointments]
      x-pp-action: appointment:read
      parameters:
        - name: status
          in: query
          schema:
            $ref: "#/components/schemas/AppointmentStatus"
        - name: pet_id
          in: query
          schema:
            type: string
            format: uuid
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: Página de citas
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AppointmentPage"
        "401":
          $ref: "#/components/responses/Problem"
        "422":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"
  /appointments/{appointmentId}:
    parameters:
      - $ref: "#/components/parameters/AppointmentId"

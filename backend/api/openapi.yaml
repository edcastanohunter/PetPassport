openapi: 3.1.0
info:
  title: PetPassport API
  version: 1.0.0
  description: |
    API pública de PetPassport (`/api/v1`). Contrato fuente (ADR-005): el servidor Go y el cliente
    TypeScript se generan desde este archivo. Convenciones en docs/phase-1/05-api.md.
  contact:
    name: PetPassport
servers:
  - url: https://api.petpassport.app/api/v1
    description: Producción
  - url: https://api.pp.localhost/api/v1
    description: Desarrollo (compose + Traefik)
tags:
  - name: system
    description: Salud y estado del servicio
  - name: me
    description: Cuenta propia (docs/phase-1/05-api.md §3.1)
  - name: pets
    description: Mascotas del tutor (docs/phase-1/05-api.md §3.2)
  - name: legal
    description: Términos y privacidad vigentes
  - name: care-links
    description: Vínculos mascota–clínica y pacientes (docs/phase-1/05-api.md §3.3)
  - name: organizations
    description: Organizaciones y miembros (docs/phase-1/05-api.md §3.4)
  - name: invitations
    description: Invitaciones de miembros (docs/phase-1/05-api.md §3.5)
  - name: admin
    description: Administración de plataforma, solo super_admin (docs/phase-1/05-api.md §3.6)
  - name: encounters
    description: Consultas clínicas (docs/phase-2/04-api.md §1–2)
  - name: records
    description: Historial, resumen y peso de la mascota (docs/phase-2/04-api.md §3)
  - name: documents
    description: Documentos generados y verificación pública (docs/phase-2/04-api.md §13)
security:
  - bearerAuth: []
paths:
  /legal/current:
    get:
      operationId: getLegalCurrent
      summary: Versiones vigentes de términos y privacidad
      description: Público. La SPA lo usa en el onboarding y en el modal de re-consentimiento.
      tags: [legal]
      security: []
      x-pp-action: public
      responses:
        "200":
          description: Versiones vigentes
          headers:
            X-Correlation-ID:
              $ref: "#/components/headers/X-Correlation-ID"
            X-Request-ID:
              $ref: "#/components/headers/X-Request-ID"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LegalCurrent"
              examples:
                current:
                  value:
                    terms_version: 2026-10-draft
                    privacy_version: 2026-10-draft
                    terms_url: /legal/terms
                    privacy_url: /legal/privacy
        default:
          $ref: "#/components/responses/Problem"
  /me:
    get:
      operationId: getMe
      summary: Cuenta propia
      description: |
        Devuelve la cuenta del actor. Provoca el aprovisionamiento JIT (IAM-009). Acepta email sin
        verificar y onboarding pendiente para que la SPA pueda decidir a dónde redirigir.
      tags: [me]
      x-pp-action: me:read
      responses:
        "200":
          description: Cuenta del actor
          headers:
            X-Correlation-ID:
              $ref: "#/components/headers/X-Correlation-ID"
            X-Request-ID:
              $ref: "#/components/headers/X-Request-ID"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Me"
              examples:
                onboarded:
                  $ref: "#/components/examples/MeOnboarded"
        "401":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"
    patch:
      operationId: updateMe
      summary: Editar perfil
      description: |
        Actualiza los campos presentes. Para vaciar un campo opcional (`phone`, `country`, `address`,
        `emergency_contact`) se envía `null`. Registra la acción en `platform.audit_log` (sin valores).
      tags: [me]
      x-pp-action: me:update
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateMeRequest"
            examples:
              phone:
                value: { phone: "+57 300 123 4567" }
      responses:
        "200":
          description: Cuenta actualizada
          headers:
            X-Correlation-ID:
              $ref: "#/components/headers/X-Correlation-ID"
            X-Request-ID:
              $ref: "#/components/headers/X-Request-ID"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Me"
        "401":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
        "422":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"
  /me/onboarding:
    post:
      operationId: completeOnboarding
      summary: Completar onboarding
      description: |
        Acepta las versiones vigentes de términos y privacidad y registra los datos básicos (PRD-003,
        PRD-020). `422 CONSENT_VERSION_OUTDATED` si las versiones aceptadas no son las vigentes.
        Idempotente: repetirlo actualiza los datos y el consentimiento.
      tags: [me]
      x-pp-action: onboarding:complete
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OnboardingRequest"
            examples:
              owner:
                value:
                  display_name: Ana Tutora
                  country: CO
                  locale: es
                  phone: "+573001234567"
                  accept_terms_version: 2026-10-draft
                  accept_privacy_version: 2026-10-draft
      responses:
        "200":
          description: Cuenta con onboarding completado
          headers:
            X-Correlation-ID:
              $ref: "#/components/headers/X-Correlation-ID"
            X-Request-ID:
              $ref: "#/components/headers/X-Request-ID"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Me"
        "401":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
        "422":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"
  /me/consent:
    post:
      operationId: acceptConsent
      summary: Aceptar versiones vigentes de términos y privacidad
      description: Re-consentimiento tras una actualización legal. `422 CONSENT_VERSION_OUTDATED` si no son las vigentes.
      tags: [me]
      x-pp-action: me:update
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ConsentRequest"
            examples:
              current:
                value: { terms_version: 2026-10-draft, privacy_version: 2026-10-draft }
      responses:
        "204":
          description: Consentimiento registrado
          headers:
            X-Correlation-ID:
              $ref: "#/components/headers/X-Correlation-ID"
            X-Request-ID:
              $ref: "#/components/headers/X-Request-ID"
        "401":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
        "422":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"
  /pets:
    get:
      operationId: listPets
      summary: Lista de mascotas del tutor
      description: "Solo las del actor (pet:read sobre propias). Paginación por cursor; filtro por estado vital."
      tags: [pets]
      x-pp-action: pet:read
      parameters:
        - name: status
          in: query
          schema:
            type: string
            enum: [active, deceased, all]
            default: all
        - name: cursor
          in: query
          description: Cursor opaco devuelto por la página anterior.
          schema:
            type: string
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
      responses:
        "200":
          description: Página de mascotas
          headers:
            X-Correlation-ID:
              $ref: "#/components/headers/X-Correlation-ID"
            X-Request-ID:
              $ref: "#/components/headers/X-Request-ID"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PetPage"
        "401":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"
    post:
      operationId: createPet
      summary: Registrar mascota
      description: "Crea la mascota del actor (pet:register). Proyección síncrona: aparece inmediatamente en la lista (PRD-005)."
      tags: [pets]
      x-pp-action: pet:register
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreatePetRequest"
            examples:
              luna:
                value:
                  name: Luna
                  species: dog
                  breed: Beagle
                  sex: female
                  neutered: "yes"
                  birth_date: { date: "2021-05-10", approximate: false }
      responses:
        "201":
          description: Mascota creada
          headers:
            Location:
              description: URL del recurso creado.
              schema:
                type: string
            ETag:
              $ref: "#/components/headers/ETag"
            X-Correlation-ID:
              $ref: "#/components/headers/X-Correlation-ID"
            X-Request-ID:
              $ref: "#/components/headers/X-Request-ID"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Pet"
        "401":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
        "409":
          $ref: "#/components/responses/Problem"
        "422":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"
  /pets/{petId}:
    parameters:
      - $ref: "#/components/parameters/PetId"
    get:
      operationId: getPet
      summary: Ficha de la mascota
      description: Visible para el tutor (G), organizaciones con vínculo activo (L) o super_admin. No visible → 404 sin revelar existencia.
      tags: [pets]
      x-pp-action: pet:read
      responses:
        "200":
          description: Mascota
          headers:
            ETag:
              $ref: "#/components/headers/ETag"
            X-Correlation-ID:
              $ref: "#/components/headers/X-Correlation-ID"
            X-Request-ID:
              $ref: "#/components/headers/X-Request-ID"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Pet"
        "401":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"
    patch:
      operationId: updatePet
      summary: Editar perfil de la mascota
      description: Solo el tutor (o super_admin). Requiere `If-Match` con la versión conocida; discrepancia → 409 CONFLICT_VERSION (PRD-006).
      tags: [pets]
      x-pp-action: pet:update
      parameters:
        - $ref: "#/components/parameters/IfMatch"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdatePetRequest"
      responses:
        "200":
          description: Mascota actualizada
          headers:
            ETag:
              $ref: "#/components/headers/ETag"
            X-Correlation-ID:
              $ref: "#/components/headers/X-Correlation-ID"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Pet"
        "401":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        "409":
          $ref: "#/components/responses/Problem"
        "422":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"
  /pets/{petId}/microchip:
    parameters:
      - $ref: "#/components/parameters/PetId"
    put:
      operationId: putPetMicrochip
      summary: Asignar o corregir el microchip
      description: Solo el tutor. Una sola corrección; segunda → 409 MICROCHIP_CORRECTION_LIMIT. Chip ajeno → 409 MICROCHIP_ALREADY_ASSIGNED sin revelar la otra mascota (PRD-007).
      tags: [pets]
      x-pp-action: pet:microchip
      parameters:
        - $ref: "#/components/parameters/IfMatch"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MicrochipRequest"
      responses:
        "200":
          description: Mascota con el microchip actualizado
          headers:
            ETag:
              $ref: "#/components/headers/ETag"
            X-Correlation-ID:
              $ref: "#/components/headers/X-Correlation-ID"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Pet"
        "401":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        "409":
          $ref: "#/components/responses/Problem"
        "422":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"
  /pets/{petId}/photo:
    parameters:
      - $ref: "#/components/parameters/PetId"
    put:
      operationId: putPetPhoto
      summary: Subir o reemplazar la foto
      description: Solo el tutor. JPEG/PNG/WebP/HEIC ≤ 5 MB; el servidor re-encodea (1024 px + miniatura 256 px) y sirve por URL prefirmada (ARQ-012, SEC-004).
      tags: [pets]
      x-pp-action: pet:photo
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              additionalProperties: false
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
      responses:
        "200":
          description: Mascota con la foto actualizada
          headers:
            ETag:
              $ref: "#/components/headers/ETag"
            X-Correlation-ID:
              $ref: "#/components/headers/X-Correlation-ID"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Pet"
        "401":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        "413":
          $ref: "#/components/responses/Problem"
        "415":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"
    delete:
      operationId: deletePetPhoto
      summary: Quitar la foto
      description: Solo el tutor. La anterior se conserva en storage 30 días (PRD-008).
      tags: [pets]
      x-pp-action: pet:photo
      responses:
        "200":
          description: Mascota sin foto
          headers:
            ETag:
              $ref: "#/components/headers/ETag"
            X-Correlation-ID:
              $ref: "#/components/headers/X-Correlation-ID"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Pet"
        "401":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"
  /pets/{petId}/deceased:
    parameters:
      - $ref: "#/components/parameters/PetId"
    post:
      operationId: markPetDeceased
      summary: Marcar como fallecida
      description: Solo el tutor; exige confirmación en la UI. Fecha opcional ≤ hoy y ≥ nacimiento. Requiere If-Match (PRD-009).
      tags: [pets]
      x-pp-action: pet:deceased
      parameters:
        - $ref: "#/components/parameters/IfMatch"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DeceasedRequest"
      responses:
        "200":
          description: Mascota en estado fallecida
          headers:
            ETag:
              $ref: "#/components/headers/ETag"
            X-Correlation-ID:
              $ref: "#/components/headers/X-Correlation-ID"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Pet"
        "401":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        "409":
          $ref: "#/components/responses/Problem"
        "422":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"
  /pets/{petId}/deceased/undo:
    parameters:
      - $ref: "#/components/parameters/PetId"
    post:
      operationId: undoPetDeceased
      summary: Deshacer fallecimiento
      description: Dentro de las 24 h (PRD-009); después → 409 UNDO_WINDOW_EXPIRED.
      tags: [pets]
      x-pp-action: pet:deceased
      responses:
        "200":
          description: Mascota reactivada
          headers:
            ETag:
              $ref: "#/components/headers/ETag"
            X-Correlation-ID:
              $ref: "#/components/headers/X-Correlation-ID"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Pet"
        "401":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        "409":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"
  /pets/{petId}/transfer:
    parameters:
      - $ref: "#/components/parameters/PetId"
    post:
      operationId: initiatePetTransfer
      summary: Iniciar transferencia de tutela
      description: Solo el tutor. Envía un email al destinatario con un enlace de un solo uso que caduca en 7 días; si no tiene cuenta, se le invita a registrarse con ese email (PRD-010).
      tags: [pets]
      x-pp-action: pet:transfer
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TransferRequest"
      responses:
        "202":
          description: Transferencia pendiente
          headers:
            ETag:
              $ref: "#/components/headers/ETag"
            X-Correlation-ID:
              $ref: "#/components/headers/X-Correlation-ID"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Pet"
        "401":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        "409":
          $ref: "#/components/responses/Problem"
        "422":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"
    delete:
      operationId: cancelPetTransfer
      summary: Cancelar transferencia pendiente
      description: Cancela la transferencia pendiente de la mascota; el enlace enviado deja de ser válido. Solo el tutor actual. Sin transferencia pendiente → 404.
      tags: [pets]
      x-pp-action: pet:transfer
      responses:
        "200":
          description: Transferencia cancelada
          headers:
            ETag:
              $ref: "#/components/headers/ETag"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Pet"
        "401":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        "409":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"
  /pet-transfers/{token}:
    parameters:
      - $ref: "#/components/parameters/Token"
    get:
      operationId: getPetTransfer
      summary: Previsualizar una transferencia
      description: Cualquier autenticado con el enlace. Token inválido, caducado o usado → 404 sin distinguir.
      tags: [pets]
      x-pp-action: pet:transfer:read
      responses:
        "200":
          description: Previsualización
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TransferPreview"
        "401":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"
  /pet-transfers/{token}/accept:
    parameters:
      - $ref: "#/components/parameters/Token"
    post:
      operationId: acceptPetTransfer
      summary: Aceptar una transferencia
      description: El email del principal debe coincidir con el destinatario (403 TRANSFER_EMAIL_MISMATCH). La mascota pasa al nuevo tutor con la misma PetID y sus vínculos.
      tags: [pets]
      x-pp-action: pet:transfer:accept
      responses:
        "200":
          description: Mascota transferida (vista del nuevo tutor)
          headers:
            ETag:
              $ref: "#/components/headers/ETag"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Pet"
        "401":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"
  /pets/{petId}/care-links:
    parameters:
      - $ref: "#/components/parameters/PetId"
    post:
      operationId: grantCareLink
      summary: Vincular la mascota a una clínica
      description: Solo clínicas activas (I5); máximo 20 vínculos activos (I8). Idempotente — si ya existe el vínculo activo responde 200 (PRD-015).
      tags: [care-links]
      x-pp-action: pet:carelink:grant
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CareLinkRequest"
      responses:
        "200":
          description: El vínculo ya estaba activo
          headers:
            ETag:
              $ref: "#/components/headers/ETag"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Pet"
        "201":
          description: Vínculo creado
          headers:
            ETag:
              $ref: "#/components/headers/ETag"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Pet"
        "401":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        "409":
          $ref: "#/components/responses/Problem"
        "422":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"
  /pets/{petId}/care-links/{organizationId}:
    parameters:
      - $ref: "#/components/parameters/PetId"
      - $ref: "#/components/parameters/OrganizationId"
    delete:
      operationId: revokeCareLink
      summary: Revocar un vínculo
      description: La clínica deja de ver la mascota en el siguiente request.
      tags: [care-links]
      x-pp-action: pet:carelink:revoke
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RevokeCareLinkRequest"
      responses:
        "200":
          description: Vínculo revocado
          headers:
            ETag:
              $ref: "#/components/headers/ETag"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Pet"
        "401":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        "409":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"
  /organizations:
    post:
      operationId: createOrganization
      summary: Registrar organización
      description: El fundador queda como admin; la organización nace pending_verification con un PublicCode (PRD-011). tax_id duplicado → 422 {field tax_id, code ALREADY_REGISTERED}.
      tags: [organizations]
      x-pp-action: org:register
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateOrganizationRequest"
            examples:
              clinica:
                value:
                  type: clinic
                  legal_name: Clínica Veterinaria Sur S.A.S.
                  display_name: Clínica Sur
                  tax_id: { country: CO, value: 900123456-8 }
                  address: { country: CO, region: Antioquia, city: Medellín, line1: "Calle 10 # 20-30" }
                  contact: { email: contacto@clinicasur.co, phone: "+573001234567" }
      responses:
        "201":
          description: Organización creada
          headers:
            Location:
              description: URL del recurso creado.
              schema:
                type: string
            ETag:

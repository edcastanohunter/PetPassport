openapi: 3.1.0
info:
  title: PetPassport API
  version: 1.0.0
  description: |
    API pública de PetPassport (`/api/v1`). Contrato fuente (ADR-005): el servidor Go y el cliente
    TypeScript se generan desde este archivo. Convenciones en docs/phase-1/05-api.md.
  contact:
    name: PetPassport
servers:
  - url: https://api.petpassport.app/api/v1
    description: Producción
  - url: https://api.pp.localhost/api/v1
    description: Desarrollo (compose + Traefik)
tags:
  - name: system
    description: Salud y estado del servicio
  - name: me
    description: Cuenta propia (docs/phase-1/05-api.md §3.1)
  - name: pets
    description: Mascotas del tutor (docs/phase-1/05-api.md §3.2)
  - name: legal
    description: Términos y privacidad vigentes
  - name: care-links
    description: Vínculos mascota–clínica y pacientes (docs/phase-1/05-api.md §3.3)
  - name: organizations
    description: Organizaciones y miembros (docs/phase-1/05-api.md §3.4)
  - name: invitations
    description: Invitaciones de miembros (docs/phase-1/05-api.md §3.5)
security:
  - bearerAuth: []
paths:
  /legal/current:
    get:
      operationId: getLegalCurrent
      summary: Versiones vigentes de términos y privacidad
      description: Público. La SPA lo usa en el onboarding y en el modal de re-consentimiento.
      tags: [legal]
      security: []
      x-pp-action: public
      responses:
        "200":
          description: Versiones vigentes
          headers:
            X-Correlation-ID:
              $ref: "#/components/headers/X-Correlation-ID"
            X-Request-ID:
              $ref: "#/components/headers/X-Request-ID"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LegalCurrent"
              examples:
                current:
                  value:
                    terms_version: 2026-10-draft
                    privacy_version: 2026-10-draft
                    terms_url: /legal/terms
                    privacy_url: /legal/privacy
        default:
          $ref: "#/components/responses/Problem"
  /me:
    get:
      operationId: getMe
      summary: Cuenta propia
      description: |
        Devuelve la cuenta del actor. Provoca el aprovisionamiento JIT (IAM-009). Acepta email sin
        verificar y onboarding pendiente para que la SPA pueda decidir a dónde redirigir.
      tags: [me]
      x-pp-action: me:read
      responses:
        "200":
          description: Cuenta del actor
          headers:
            X-Correlation-ID:
              $ref: "#/components/headers/X-Correlation-ID"
            X-Request-ID:
              $ref: "#/components/headers/X-Request-ID"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Me"
              examples:
                onboarded:
                  $ref: "#/components/examples/MeOnboarded"
        "401":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"
    patch:
      operationId: updateMe
      summary: Editar perfil
      description: |
        Actualiza los campos presentes. Para vaciar un campo opcional (`phone`, `country`, `address`,
        `emergency_contact`) se envía `null`. Registra la acción en `platform.audit_log` (sin valores).
      tags: [me]
      x-pp-action: me:update
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateMeRequest"
            examples:
              phone:
                value: { phone: "+57 300 123 4567" }
      responses:
        "200":
          description: Cuenta actualizada
          headers:
            X-Correlation-ID:
              $ref: "#/components/headers/X-Correlation-ID"
            X-Request-ID:
              $ref: "#/components/headers/X-Request-ID"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Me"
        "401":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
        "422":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"
  /me/onboarding:
    post:
      operationId: completeOnboarding
      summary: Completar onboarding
      description: |
        Acepta las versiones vigentes de términos y privacidad y registra los datos básicos (PRD-003,
        PRD-020). `422 CONSENT_VERSION_OUTDATED` si las versiones aceptadas no son las vigentes.
        Idempotente: repetirlo actualiza los datos y el consentimiento.
      tags: [me]
      x-pp-action: onboarding:complete
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OnboardingRequest"
            examples:
              owner:
                value:
                  display_name: Ana Tutora
                  country: CO
                  locale: es
                  phone: "+573001234567"
                  accept_terms_version: 2026-10-draft
                  accept_privacy_version: 2026-10-draft
      responses:
        "200":
          description: Cuenta con onboarding completado
          headers:
            X-Correlation-ID:
              $ref: "#/components/headers/X-Correlation-ID"
            X-Request-ID:
              $ref: "#/components/headers/X-Request-ID"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Me"
        "401":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
        "422":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"
  /me/consent:
    post:
      operationId: acceptConsent
      summary: Aceptar versiones vigentes de términos y privacidad
      description: Re-consentimiento tras una actualización legal. `422 CONSENT_VERSION_OUTDATED` si no son las vigentes.
      tags: [me]
      x-pp-action: me:update
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ConsentRequest"
            examples:
              current:
                value: { terms_version: 2026-10-draft, privacy_version: 2026-10-draft }
      responses:
        "204":
          description: Consentimiento registrado
          headers:
            X-Correlation-ID:
              $ref: "#/components/headers/X-Correlation-ID"
            X-Request-ID:
              $ref: "#/components/headers/X-Request-ID"
        "401":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
        "422":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"
  /pets:
    get:
      operationId: listPets
      summary: Lista de mascotas del tutor
      description: "Solo las del actor (pet:read sobre propias). Paginación por cursor; filtro por estado vital."
      tags: [pets]
      x-pp-action: pet:read
      parameters:
        - name: status
          in: query
          schema:
            type: string
            enum: [active, deceased, all]
            default: all
        - name: cursor
          in: query
          description: Cursor opaco devuelto por la página anterior.
          schema:
            type: string
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
      responses:
        "200":
          description: Página de mascotas
          headers:
            X-Correlation-ID:
              $ref: "#/components/headers/X-Correlation-ID"
            X-Request-ID:
              $ref: "#/components/headers/X-Request-ID"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PetPage"
        "401":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"
    post:
      operationId: createPet
      summary: Registrar mascota
      description: "Crea la mascota del actor (pet:register). Proyección síncrona: aparece inmediatamente en la lista (PRD-005)."
      tags: [pets]
      x-pp-action: pet:register
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreatePetRequest"
            examples:
              luna:
                value:
                  name: Luna
                  species: dog
                  breed: Beagle
                  sex: female
                  neutered: "yes"
                  birth_date: { date: "2021-05-10", approximate: false }
      responses:
        "201":
          description: Mascota creada
          headers:
            Location:
              description: URL del recurso creado.
              schema:
                type: string
            ETag:
              $ref: "#/components/headers/ETag"
            X-Correlation-ID:
              $ref: "#/components/headers/X-Correlation-ID"
            X-Request-ID:
              $ref: "#/components/headers/X-Request-ID"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Pet"
        "401":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
        "409":
          $ref: "#/components/responses/Problem"
        "422":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"
  /pets/{petId}:
    parameters:
      - $ref: "#/components/parameters/PetId"
    get:
      operationId: getPet
      summary: Ficha de la mascota
      description: Visible para el tutor (G), organizaciones con vínculo activo (L) o super_admin. No visible → 404 sin revelar existencia.
      tags: [pets]
      x-pp-action: pet:read
      responses:
        "200":
          description: Mascota
          headers:
            ETag:
              $ref: "#/components/headers/ETag"
            X-Correlation-ID:
              $ref: "#/components/headers/X-Correlation-ID"
            X-Request-ID:
              $ref: "#/components/headers/X-Request-ID"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Pet"
        "401":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"
    patch:
      operationId: updatePet
      summary: Editar perfil de la mascota
      description: Solo el tutor (o super_admin). Requiere `If-Match` con la versión conocida; discrepancia → 409 CONFLICT_VERSION (PRD-006).
      tags: [pets]
      x-pp-action: pet:update
      parameters:
        - $ref: "#/components/parameters/IfMatch"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdatePetRequest"
      responses:
        "200":
          description: Mascota actualizada
          headers:
            ETag:
              $ref: "#/components/headers/ETag"
            X-Correlation-ID:
              $ref: "#/components/headers/X-Correlation-ID"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Pet"
        "401":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        "409":
          $ref: "#/components/responses/Problem"
        "422":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"
  /pets/{petId}/microchip:
    parameters:
      - $ref: "#/components/parameters/PetId"
    put:
      operationId: putPetMicrochip
      summary: Asignar o corregir el microchip
      description: Solo el tutor. Una sola corrección; segunda → 409 MICROCHIP_CORRECTION_LIMIT. Chip ajeno → 409 MICROCHIP_ALREADY_ASSIGNED sin revelar la otra mascota (PRD-007).
      tags: [pets]
      x-pp-action: pet:microchip
      parameters:
        - $ref: "#/components/parameters/IfMatch"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MicrochipRequest"
      responses:
        "200":
          description: Mascota con el microchip actualizado
          headers:
            ETag:
              $ref: "#/components/headers/ETag"
            X-Correlation-ID:
              $ref: "#/components/headers/X-Correlation-ID"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Pet"
        "401":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        "409":
          $ref: "#/components/responses/Problem"
        "422":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"
  /pets/{petId}/photo:
    parameters:
      - $ref: "#/components/parameters/PetId"
    put:
      operationId: putPetPhoto
      summary: Subir o reemplazar la foto
      description: Solo el tutor. JPEG/PNG/WebP/HEIC ≤ 5 MB; el servidor re-encodea (1024 px + miniatura 256 px) y sirve por URL prefirmada (ARQ-012, SEC-004).
      tags: [pets]
      x-pp-action: pet:photo
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              additionalProperties: false
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
      responses:
        "200":
          description: Mascota con la foto actualizada
          headers:
            ETag:
              $ref: "#/components/headers/ETag"
            X-Correlation-ID:
              $ref: "#/components/headers/X-Correlation-ID"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Pet"
        "401":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        "413":
          $ref: "#/components/responses/Problem"
        "415":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"
    delete:
      operationId: deletePetPhoto
      summary: Quitar la foto
      description: Solo el tutor. La anterior se conserva en storage 30 días (PRD-008).
      tags: [pets]
      x-pp-action: pet:photo
      responses:
        "200":
          description: Mascota sin foto
          headers:
            ETag:
              $ref: "#/components/headers/ETag"
            X-Correlation-ID:
              $ref: "#/components/headers/X-Correlation-ID"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Pet"
        "401":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"
  /pets/{petId}/deceased:
    parameters:
      - $ref: "#/components/parameters/PetId"
    post:
      operationId: markPetDeceased
      summary: Marcar como fallecida
      description: Solo el tutor; exige confirmación en la UI. Fecha opcional ≤ hoy y ≥ nacimiento. Requiere If-Match (PRD-009).
      tags: [pets]
      x-pp-action: pet:deceased
      parameters:
        - $ref: "#/components/parameters/IfMatch"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DeceasedRequest"
      responses:
        "200":
          description: Mascota en estado fallecida
          headers:
            ETag:
              $ref: "#/components/headers/ETag"
            X-Correlation-ID:
              $ref: "#/components/headers/X-Correlation-ID"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Pet"
        "401":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        "409":
          $ref: "#/components/responses/Problem"
        "422":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"
  /pets/{petId}/deceased/undo:
    parameters:
      - $ref: "#/components/parameters/PetId"
    post:
      operationId: undoPetDeceased
      summary: Deshacer fallecimiento
      description: Dentro de las 24 h (PRD-009); después → 409 UNDO_WINDOW_EXPIRED.
      tags: [pets]
      x-pp-action: pet:deceased
      responses:
        "200":
          description: Mascota reactivada
          headers:
            ETag:
              $ref: "#/components/headers/ETag"
            X-Correlation-ID:
              $ref: "#/components/headers/X-Correlation-ID"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Pet"
        "401":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        "409":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"
  /pets/{petId}/transfer:
    parameters:
      - $ref: "#/components/parameters/PetId"
    post:
      operationId: initiatePetTransfer
      summary: Iniciar transferencia de tutela
      description: Solo el tutor. Envía un email al destinatario con un enlace de un solo uso que caduca en 7 días; si no tiene cuenta, se le invita a registrarse con ese email (PRD-010).
      tags: [pets]
      x-pp-action: pet:transfer
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TransferRequest"
      responses:
        "202":
          description: Transferencia pendiente
          headers:
            ETag:
              $ref: "#/components/headers/ETag"
            X-Correlation-ID:
              $ref: "#/components/headers/X-Correlation-ID"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Pet"
        "401":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        "409":
          $ref: "#/components/responses/Problem"
        "422":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"
    delete:
      operationId: cancelPetTransfer
      summary: Cancelar transferencia pendiente
      description: Cancela la transferencia pendiente de la mascota; el enlace enviado deja de ser válido. Solo el tutor actual. Sin transferencia pendiente → 404.
      tags: [pets]
      x-pp-action: pet:transfer
      responses:
        "200":
          description: Transferencia cancelada
          headers:
            ETag:
              $ref: "#/components/headers/ETag"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Pet"
        "401":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        "409":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"
  /pet-transfers/{token}:
    parameters:
      - $ref: "#/components/parameters/Token"
    get:
      operationId: getPetTransfer
      summary: Previsualizar una transferencia
      description: Cualquier autenticado con el enlace. Token inválido, caducado o usado → 404 sin distinguir.
      tags: [pets]
      x-pp-action: pet:transfer:read
      responses:
        "200":
          description: Previsualización
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TransferPreview"
        "401":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"
  /pet-transfers/{token}/accept:
    parameters:
      - $ref: "#/components/parameters/Token"
    post:
      operationId: acceptPetTransfer
      summary: Aceptar una transferencia
      description: El email del principal debe coincidir con el destinatario (403 TRANSFER_EMAIL_MISMATCH). La mascota pasa al nuevo tutor con la misma PetID y sus vínculos.
      tags: [pets]
      x-pp-action: pet:transfer:accept
      responses:
        "200":
          description: Mascota transferida (vista del nuevo tutor)
          headers:
            ETag:
              $ref: "#/components/headers/ETag"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Pet"
        "401":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"
  /pets/{petId}/care-links:
    parameters:
      - $ref: "#/components/parameters/PetId"
    post:
      operationId: grantCareLink
      summary: Vincular la mascota a una clínica
      description: Solo clínicas activas (I5); máximo 20 vínculos activos (I8). Idempotente — si ya existe el vínculo activo responde 200 (PRD-015).
      tags: [care-links]
      x-pp-action: pet:carelink:grant
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CareLinkRequest"
      responses:
        "200":
          description: El vínculo ya estaba activo
          headers:
            ETag:
              $ref: "#/components/headers/ETag"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Pet"
        "201":
          description: Vínculo creado
          headers:
            ETag:
              $ref: "#/components/headers/ETag"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Pet"
        "401":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        "409":
          $ref: "#/components/responses/Problem"
        "422":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"
  /pets/{petId}/care-links/{organizationId}:
    parameters:
      - $ref: "#/components/parameters/PetId"
      - $ref: "#/components/parameters/OrganizationId"
    delete:
      operationId: revokeCareLink
      summary: Revocar un vínculo
      description: La clínica deja de ver la mascota en el siguiente request.
      tags: [care-links]
      x-pp-action: pet:carelink:revoke
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RevokeCareLinkRequest"
      responses:
        "200":
          description: Vínculo revocado
          headers:
            ETag:
              $ref: "#/components/headers/ETag"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Pet"
        "401":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        "409":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"
  /organizations:
    post:
      operationId: createOrganization
      summary: Registrar organización
      description: El fundador queda como admin; la organización nace pending_verification con un PublicCode (PRD-011). tax_id duplicado → 422 {field tax_id, code ALREADY_REGISTERED}.
      tags: [organizations]
      x-pp-action: org:register
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateOrganizationRequest"
            examples:
              clinica:
                value:
                  type: clinic
                  legal_name: Clínica Veterinaria Sur S.A.S.
                  display_name: Clínica Sur
                  tax_id: { country: CO, value: 900123456-8 }
                  address: { country: CO, region: Antioquia, city: Medellín, line1: "Calle 10 # 20-30" }
                  contact: { email: contacto@clinicasur.co, phone: "+573001234567" }
      responses:
        "201":
          description: Organización creada
          headers:
            Location:
              description: URL del recurso creado.
              schema:
                type: string
            ETag:
              $ref: "#/components/headers/ETag"
            X-Correlation-ID:
              $ref: "#/components/headers/X-Correlation-ID"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Organization"
        "401":
          $ref: "#/components/responses/Problem"
        "409":
          $ref: "#/components/responses/Problem"
        "422":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"
  /organizations/lookup:
    get:
      operationId: lookupOrganization
      summary: Buscar clínica por código público
      description: Devuelve el resumen mínimo solo si la organización es una clínica activa; cualquier otra cosa → 404 (PRD-015).
      tags: [care-links]
      x-pp-action: org:lookup
      parameters:
        - name: code
          in: query
          required: true
          schema:
            type: string
            minLength: 6
            maxLength: 6
            pattern: "^[0-9A-Za-z]{6}$"
      responses:
        "200":
          description: Resumen de la clínica
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrgSummary"
        "401":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"
  /organizations/{orgId}:
    parameters:
      - $ref: "#/components/parameters/OrgId"
    get:
      operationId: getOrganization
      summary: Ficha de la organización
      description: Vista completa para miembros y super_admin; resumen público para el resto.
      tags: [organizations]
      x-pp-action: org:read
      responses:
        "200":
          description: Organización o resumen
          headers:
            ETag:
              $ref: "#/components/headers/ETag"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrganizationOrSummary"
        "401":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"
    patch:
      operationId: updateOrganization
      summary: Editar el perfil
      description: Admin de la organización. Cambiar legal_name o tax_id en una organización activa la devuelve a pending_verification (PRD-012). Requiere If-Match.
      tags: [organizations]
      x-pp-action: org:update
      parameters:
        - $ref: "#/components/parameters/IfMatch"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateOrganizationRequest"
      responses:
        "200":
          description: Organización actualizada
          headers:
            ETag:
              $ref: "#/components/headers/ETag"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Organization"
        "401":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        "409":
          $ref: "#/components/responses/Problem"
        "422":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"
  /organizations/{orgId}/members:
    parameters:
      - $ref: "#/components/parameters/OrgId"
    get:
      operationId: listOrganizationMembers
      summary: Miembros activos
      description: Solo miembros de la organización o super_admin.
      tags: [organizations]
      x-pp-action: org:read
      responses:
        "200":
          description: Miembros
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MemberList"
        "401":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"
  /organizations/{orgId}/members/{userId}:
    parameters:
      - $ref: "#/components/parameters/OrgId"
      - $ref: "#/components/parameters/UserId"
    patch:
      operationId: changeMemberRole
      summary: Cambiar el rol de un miembro
      description: No se puede degradar al último admin (409 LAST_ADMIN_CANNOT_BE_REMOVED); el rol debe ser válido para el tipo (422 ROLE_NOT_ALLOWED_FOR_TYPE).
      tags: [organizations]
      x-pp-action: org:member:role
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateMemberRequest"
      responses:
        "200":
          description: Miembro actualizado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Member"
        "401":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        "409":
          $ref: "#/components/responses/Problem"
        "422":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"
    delete:
      operationId: removeMember
      summary: Retirar un miembro
      description: Pierde el acceso en el siguiente request (caché de membresías invalidada, PRD-014).
      tags: [organizations]
      x-pp-action: org:member:remove
      responses:
        "204":
          description: Miembro retirado
        "401":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        "409":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"
  /organizations/{orgId}/invitations:
    parameters:
      - $ref: "#/components/parameters/OrgId"
    post:
      operationId: createInvitation
      summary: Invitar un miembro
      description: Re-invitar al mismo email revoca la invitación pendiente anterior (O4). Caduca a los 7 días.
      tags: [invitations]
      x-pp-action: org:member:invite
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateInvitationRequest"
      responses:
        "201":
          description: Invitación creada
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Invitation"
        "401":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        "409":
          $ref: "#/components/responses/Problem"
        "422":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"
    get:
      operationId: listInvitations
      summary: Invitaciones de la organización
      description: Lista las invitaciones de la organización (pendientes, aceptadas, revocadas y caducadas). Solo administradores de la organización.
      tags: [invitations]
      x-pp-action: org:member:invite
      parameters:
        - name: status
          in: query
          schema:
            type: string
            enum: [pending, accepted, revoked, expired]
      responses:
        "200":
          description: Invitaciones
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InvitationList"
        "401":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"
  /organizations/{orgId}/invitations/{invitationId}:
    parameters:
      - $ref: "#/components/parameters/OrgId"
      - $ref: "#/components/parameters/InvitationId"
    delete:
      operationId: revokeInvitation
      summary: Revocar una invitación pendiente
      description: Revoca una invitación pendiente; su enlace deja de ser válido. Solo administradores de la organización. Inexistente o no pendiente → 404.
      tags: [invitations]
      x-pp-action: org:member:invite
      responses:
        "204":
          description: Invitación revocada
        "401":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        "409":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"
  /organizations/{orgId}/invitations/{invitationId}/resend:
    parameters:
      - $ref: "#/components/parameters/OrgId"
      - $ref: "#/components/parameters/InvitationId"
    post:
      operationId: resendInvitation
      summary: Reenviar una invitación
      description: Genera un enlace nuevo (el anterior deja de valer). Máximo 3 reenvíos en 24 h (429 INVITATION_RESEND_LIMIT).
      tags: [invitations]
      x-pp-action: org:member:invite
      responses:
        "204":
          description: Invitación reenviada
        "401":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        "429":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"
  /invitations/{token}:
    parameters:
      - $ref: "#/components/parameters/Token"
    get:
      operationId: getInvitation
      summary: Previsualizar una invitación
      description: Cualquier autenticado con el enlace. Inválida o caducada → 404 sin distinguir.
      tags: [invitations]
      x-pp-action: org:invitation:read
      responses:
        "200":
          description: Previsualización
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InvitationPreview"
        "401":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"
  /invitations/{token}/accept:
    parameters:
      - $ref: "#/components/parameters/Token"
    post:
      operationId: acceptInvitation
      summary: Aceptar una invitación
      description: El email del principal debe coincidir (403 INVITATION_EMAIL_MISMATCH) y estar verificado. Devuelve Me con la nueva membresía.
      tags: [invitations]
      x-pp-action: org:invitation:accept
      responses:
        "200":
          description: Membresía creada
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Me"
        "401":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"
  /organizations/{orgId}/patients:
    parameters:
      - $ref: "#/components/parameters/OrgId"
    get:
      operationId: listPatients
      summary: Pacientes vinculados de la clínica
      description: Miembros de clínica activa (clinic_admin, veterinarian, receptionist). Búsqueda simple por nombre de mascota o tutor; cursor. Org suspendida → 403 ORGANIZATION_SUSPENDED (PRD-016).
      tags: [care-links]
      x-pp-action: org:patients:list
      parameters:
        - name: q
          in: query
          schema:
            type: string
            maxLength: 80
        - name: status
          in: query
          schema:
            type: string
            enum: [active, deceased, all]
            default: all
        - name: cursor
          in: query
          schema:
            type: string
            maxLength: 200
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
      responses:
        "200":
          description: Página de pacientes
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PatientPage"
        "401":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"
  /organizations/{orgId}/patients/{petId}:
    parameters:
      - $ref: "#/components/parameters/OrgId"
      - $ref: "#/components/parameters/PetId"
    get:
      operationId: getPatient
      summary: Ficha de un paciente (solo lectura)
      description: Requiere vínculo activo de esta organización (L) y membresía de clínica; incluye guardian_contact (pet:guardian_contact:read). No visible → 404.
      tags: [care-links]
      x-pp-action: pet:read
      responses:
        "200":
          description: Ficha con contacto del tutor
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Pet"
        "401":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"
  /healthz:
    get:
      operationId: getHealthz
      summary: Liveness pública (usada por el WAF)
      description: Indica que el proceso responde. No comprueba dependencias (eso lo hace /readyz en el puerto interno).
      tags: [system]
      security: []
      x-pp-action: public
      responses:
        "200":
          description: El proceso está vivo
          headers:
            X-Correlation-ID:
              $ref: "#/components/headers/X-Correlation-ID"
            X-Request-ID:
              $ref: "#/components/headers/X-Request-ID"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
              examples:
                ok:
                  value: { status: ok }
        default:
          $ref: "#/components/responses/Problem"
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Access token emitido por Keycloak (realm `petpassport`, audiencia `petpassport-api`).
  parameters:
    PetId:
      name: petId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    OrgId:
      name: orgId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    OrganizationId:
      name: organizationId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    UserId:
      name: userId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    InvitationId:
      name: invitationId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    Token:
      name: token
      in: path
      required: true
      description: Token de un solo uso (32 bytes en base64url).
      schema:
        type: string
        minLength: 20
        maxLength: 64
        pattern: "^[A-Za-z0-9_-]+$"
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: UUID que identifica el intento del usuario; repetida con el mismo cuerpo devuelve la respuesta original (ARQ-008).
      schema:
        type: string
        format: uuid
    IfMatch:
      name: If-Match
      in: header
      required: true
      description: Versión conocida del recurso (ETag de la última lectura).
      schema:
        type: integer
        format: int64
        minimum: 1
  headers:
    ETag:
      description: Versión del recurso; enviar en If-Match para los comandos.
      schema:
        type: integer
        format: int64
    X-Correlation-ID:
      description: Identificador de correlación (UUID). Se acepta entrante y siempre se devuelve.
      schema:
        type: string
        format: uuid
    X-Request-ID:
      description: Identificador único del request.
      schema:
        type: string
        format: uuid
  examples:
    MeOnboarded:
      value:
        id: 0192f3a2-2222-7aaa-bbbb-dddddddddddd
        email: ana@example.com
        email_verified: true
        display_name: Ana Tutora
        locale: es
        country: CO
        phone: "+573001234567"
        address: null
        emergency_contact: null
        global_roles: [pet_owner]
        memberships: []
        onboarding_required: false
        consent:
          terms_version: 2026-10-draft
          privacy_version: 2026-10-draft
          accepted_at: 2026-10-20T10:00:00Z
        consent_outdated: false
        status: active
  schemas:
    DisplayName:
      type: string
      minLength: 1
      maxLength: 120
      pattern: "^[^\\x00-\\x08\\x0B\\x0C\\x0E-\\x1F]*$"
    CountryCode:
      type: string
      description: ISO 3166-1 alpha-2.
      pattern: "^[A-Za-z]{2}$"
    Locale:
      type: string
      enum: [es, en]
    Phone:
      type: string
      description: E.164; se aceptan espacios, guiones y paréntesis que se eliminan al normalizar.
      maxLength: 32
      pattern: "^\\+[0-9 ()\\-.]{6,30}$"
    ConsentVersion:
      type: string
      maxLength: 32
      pattern: "^[A-Za-z0-9.-]+$"
    Address:
      type: object
      additionalProperties: false
      required: [country, city, line1]
      properties:
        country:
          $ref: "#/components/schemas/CountryCode"
        region:
          type: string
          maxLength: 120
        city:
          type: string
          minLength: 1
          maxLength: 120
        line1:
          type: string
          minLength: 1
          maxLength: 200
        line2:
          type: string
          maxLength: 200
        postal_code:
          type: string
          maxLength: 20
    EmergencyContact:
      type: object
      additionalProperties: false
      required: [name, phone]
      properties:
        name:
          $ref: "#/components/schemas/DisplayName"
        phone:
          $ref: "#/components/schemas/Phone"
        relationship:
          type: string
          maxLength: 60
    Consent:
      type: object
      additionalProperties: false
      required: [terms_version, privacy_version, accepted_at]
      properties:
        terms_version:
          type: string
        privacy_version:
          type: string
        accepted_at:
          type: string
          format: date-time
    PetName:
      type: string
      description: 1–60 caracteres; letras/espacios/'/-; sin control. Se recortan espacios y se colapsan.
      minLength: 1
      maxLength: 60
      pattern: "^[^\\x00-\\x08\\x0B\\x0C\\x0E-\\x1F]*$"
    Breed:
      type: string
      description: Texto libre en F1 (catálogo en F2).
      minLength: 1
      maxLength: 80
    Markings:
      type: string
      description: Color / señas particulares.
      maxLength: 200
    Species:
      type: string
      enum: [dog, cat, bird, rabbit, reptile, rodent, equine, ferret, fish, other]
    SpeciesOther:
      type: string
      description: Obligatoria si species = other; 1–40.
      minLength: 1
      maxLength: 40
    Sex:
      type: string
      enum: [male, female, unknown]
    Neutered:
      type: string
      enum: ["yes", "no", "unknown"]
    BirthDate:
      type: object
      additionalProperties: false
      required: [date, approximate]
      properties:
        date:
          type: string
          description: Fecha civil YYYY-MM-DD; ≤ hoy y ≥ hoy − 40 años.
          format: date
        approximate:
          type: boolean
    Microchip:
      type: string
      description: ISO 11784/11785 (15 dígitos) o legado (9/10 alfanuméricos). Se normaliza (sin espacios/guiones, mayúsculas).
      minLength: 9
      maxLength: 15
      pattern: "^([0-9]{15}|[A-Z0-9]{9,10})$"
    Photo:
      type: object
      additionalProperties: false
      required: [url, thumb_url, expires_at]
      properties:
        url:
          type: string
          description: URL prefirmada (15 min) de la foto (ARQ-012).
        thumb_url:
          type: string
        expires_at:
          type: string
          format: date-time
    CreatePetRequest:
      type: object
      additionalProperties: false
      required: [name, species, sex, neutered]
      properties:
        name:
          $ref: "#/components/schemas/PetName"
        species:
          $ref: "#/components/schemas/Species"
        species_other:
          $ref: "#/components/schemas/SpeciesOther"
        breed:
          $ref: "#/components/schemas/Breed"
        sex:
          $ref: "#/components/schemas/Sex"
        neutered:
          $ref: "#/components/schemas/Neutered"
        birth_date:
          $ref: "#/components/schemas/BirthDate"
        markings:
          $ref: "#/components/schemas/Markings"
    UpdatePetRequest:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        name:
          $ref: "#/components/schemas/PetName"
        species:
          $ref: "#/components/schemas/Species"
        species_other:
          $ref: "#/components/schemas/SpeciesOther"
        breed:
          description: Cadena vacía vacía el campo.
          type: string
          maxLength: 80
        sex:
          $ref: "#/components/schemas/Sex"
        neutered:
          $ref: "#/components/schemas/Neutered"
        birth_date:
          $ref: "#/components/schemas/BirthDate"
        markings:
          description: Cadena vacía vacía el campo.
          type: string
          maxLength: 200
    MicrochipRequest:
      type: object
      additionalProperties: false
      required: [microchip]
      properties:
        microchip:
          $ref: "#/components/schemas/Microchip"
    DeceasedRequest:
      type: object
      additionalProperties: false
      properties:
        deceased_at:
          type: string
          format: date
    Pet:
      type: object
      additionalProperties: false
      required: [id, version, guardian_id, name, species, sex, neutered, status, care_links, created_at, updated_at]
      properties:
        id:
          type: string
          format: uuid
        version:
          type: integer
          format: int64
        guardian_id:
          type: string
          format: uuid
        name:
          type: string
        species:
          $ref: "#/components/schemas/Species"
        species_other:
          type: [string, "null"]
        breed:
          type: [string, "null"]
        sex:
          $ref: "#/components/schemas/Sex"
        neutered:
          $ref: "#/components/schemas/Neutered"
        birth_date:
          oneOf:
            - $ref: "#/components/schemas/BirthDate"
            - type: "null"
        age:
          type: object
          additionalProperties: false
          required: [years, months]
          properties:
            years:
              type: integer
            months:
              type: integer
        markings:
          type: [string, "null"]
        microchip:
          type: [string, "null"]
        microchip_corrections:
          type: integer
          description: Correcciones de microchip ya usadas por el tutor (0..1).
        photo:
          oneOf:
            - $ref: "#/components/schemas/Photo"
            - type: "null"
        status:
          type: string
          enum: [active, deceased]
        deceased_at:
          type: [string, "null"]
          format: date
        care_links:
          type: array
          items:
            $ref: "#/components/schemas/CareLink"
        pending_transfer:
          description: Solo para el tutor.
          oneOf:
            - $ref: "#/components/schemas/PendingTransfer"
            - type: "null"
        guardian_contact:
          description: Solo con pet:guardian_contact:read (ficha de paciente de clínica).
          oneOf:
            - $ref: "#/components/schemas/GuardianContact"
            - type: "null"
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    CareLink:
      type: object
      additionalProperties: false
      required: [organization_id, display_name, status, granted_at, org_suspended]
      properties:
        organization_id:
          type: string
          format: uuid
        display_name:
          type: string
        city:
          type: [string, "null"]
        status:
          type: string
          enum: [active, revoked]
        org_suspended:
          type: boolean
        granted_at:
          type: string
          format: date-time
        revoked_at:
          type: [string, "null"]
          format: date-time
    PetListItem:
      type: object
      additionalProperties: false
      required: [id, version, name, species, status, active_links, created_at]
      properties:
        id:
          type: string
          format: uuid
        version:
          type: integer
          format: int64
        name:
          type: string
        species:
          $ref: "#/components/schemas/Species"
        breed:
          type: [string, "null"]
        photo:
          oneOf:
            - $ref: "#/components/schemas/Photo"
            - type: "null"
        status:
          type: string
          enum: [active, deceased]
        birth_date:
          oneOf:
            - $ref: "#/components/schemas/BirthDate"
            - type: "null"
        active_links:
          type: integer
        created_at:
          type: string
          format: date-time

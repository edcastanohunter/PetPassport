name: e2e

# PP-F1-QA-005: Playwright de los cinco flujos críticos + axe contra el entorno
# completo de desarrollo (unidades Quadlet rootless, Keycloak real, Mailpit). Nightly y a demanda (docs/phase-1/09 §3).
on:
  schedule:
    - cron: "0 5 * * *" # 00:00 America/Bogota
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    # Etiqueta fija: la imagen 24.04 trae Podman 5.8 (Quadlet .build, Notify=healthy);
    # ubuntu-latest migra a 26.04 en oct–nov 2026.
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: e2e/package-lock.json

      - name: Certificados locales (mkcert)
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq libnss3-tools mkcert
          make dev-certs

      # Mismo motor y modo que el equipo (ADR-026): Podman rootless con Quadlet
      # bajo el systemd de usuario del runner. Rootless publica 80/443 solo con
      # ip_unprivileged_port_start <= 80.
      - name: Podman rootless y sesión systemd de usuario
        run: |
          podman --version
          sudo sysctl -w net.ipv4.ip_unprivileged_port_start=80
          sudo loginctl enable-linger "$USER"
          for _ in $(seq 1 30); do [ -S "/run/user/$(id -u)/bus" ] && break; sleep 1; done
          echo "XDG_RUNTIME_DIR=/run/user/$(id -u)" >> "$GITHUB_ENV"

      - name: Levantar el entorno completo
        run: make dev-up

      - name: Esperar a la app, la API y el realm
        run: |
          wait_for() { # url [curl-args]
            for _ in $(seq 1 90); do curl -fsSk "$@" >/dev/null 2>&1 && return 0; sleep 5; done
            echo "timeout esperando $1" >&2; return 1
          }
          wait_for http://localhost:8180/realms/petpassport/.well-known/openid-configuration
          wait_for http://localhost:9090/readyz
          wait_for https://app.pp.localhost/config.json --resolve app.pp.localhost:443:127.0.0.1
          wait_for http://localhost:8025/api/v1/info

      - name: Instalar dependencias y navegador
        working-directory: e2e
        run: |
          npm ci --no-audit --no-fund
          npx playwright install --with-deps chromium

      - name: Typecheck de la suite
        working-directory: e2e
        run: npm run typecheck

      - name: Playwright
        working-directory: e2e
        env:
          CI: "true"
        run: npx playwright test

      - name: Logs del entorno (si falla)
        if: failure()
        run: |
          make dev-status > dev.log 2>&1 || true
          for s in api keycloak keycloak-config migrate frontend traefik; do
            journalctl --user -u "pp-dev-$s.service" -n 300 --no-pager -o cat >> dev.log 2>&1 || true
          done

      - name: Publicar informe
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            e2e/playwright-report/
            e2e/results/
            e2e/test-results/
            dev.log
          retention-days: 14
          if-no-files-found: ignore

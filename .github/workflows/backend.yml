name: backend

on:
  pull_request:
    paths: ["backend/**", "scripts/domain-coverage.sh", ".github/workflows/backend.yml"]
  push:
    branches: [main]
    paths: ["backend/**"]

permissions:
  contents: read

defaults:
  run:
    working-directory: backend

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - uses: golangci/golangci-lint-action@v7
        with:
          version: latest
          working-directory: backend
      - name: go vet (incl. integration tag)
        run: go vet -tags integration ./...

  generate-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - run: go generate ./api/...
      - name: Fail if generated code is stale
        run: git diff --exit-code -- api/gen

  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - run: go test -race -coverprofile=coverage.out ./...
      - name: cobertura domain/ >= 90 % en contextos F2 (PP-F2-QA-007)
        working-directory: .
        run: scripts/domain-coverage.sh 90
      - uses: actions/upload-artifact@v4
        with:
          name: backend-coverage
          path: backend/coverage.out

  integration:
    # testcontainers usa el Docker que trae el runner de GitHub (migraciones up/down/up, PP-F1-DAT-002).
    # En local, `make test-integration` usa la API de Podman (ADR-026).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - run: go test -race -tags integration -count=1 ./test/integration/...

  event-store-gates:
    # Gates F2 obligatorios (PP-F2-QA-007): orden total (QA-001) y rebuild con
    # dumps iguales (QA-002), en un job propio para exigirlo en la protección de
    # rama y repetido para detectar intermitencias.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - run: >-
          go test -race -tags integration -count=3
          -run 'TestEventStore_QA001_TotalOrder|TestProjection_QA002_RebuildDumpsEqual|TestProjection_FailStopAndResume'
          ./test/integration/...

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - name: govulncheck
        run: go run golang.org/x/vuln/cmd/govulncheck@latest -show verbose ./...
      - name: gosec
        run: go run github.com/securego/gosec/v2/cmd/gosec@latest -exclude-generated -exclude-dir=api/gen ./...
      - name: semgrep
        uses: semgrep/semgrep-action@v1
        with:
          config: p/golang

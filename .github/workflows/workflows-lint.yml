name: workflows-lint

on:
  pull_request:
    paths: [".github/workflows/**"]

permissions:
  contents: read

jobs:
  actionlint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
      - run: go run github.com/rhysd/actionlint/cmd/actionlint@latest -no-color

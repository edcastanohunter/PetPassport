name: docs

on:
  pull_request:
    paths: ["docs/**", "developers/**", "scripts/**", ".github/workflows/docs.yml"]

permissions:
  contents: read

jobs:
  specs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: specs <-> tracking consistency
        run: scripts/specs-status.sh --check
      - name: specs status summary
        run: scripts/specs-status.sh
      - name: markdownlint
        uses: DavidAnson/markdownlint-cli2-action@v25
        with:
          globs: "docs/**/*.md"
          config: .markdownlint.yaml
        continue-on-error: true
      - name: broken links
        uses: lycheeverse/lychee-action@v2
        with:
          args: --offline --no-progress "docs/**/*.md"
          fail: false

  developers-site:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Validate developer docs and artifacts
        run: |
          test -f developers/index.html
          test -f developers/partner-v1.yaml
          test -f developers/auth.md
          test -f developers/webhooks.md
          test -f developers/signature-vectors.md
          test -f developers/go-live-checklist.md
          test -f developers/changelog.md

# Realm `petpassport` como código (PP-F1-IAM-001/002/003). Lo aplica keycloak-config-cli de
# forma idempotente en todos los entornos; cualquier cambio manual en la consola es drift.
# Referencia: docs/phase-1/04-iam-keycloak.md. Los valores PP_* se sustituyen desde el entorno
# (IMPORT_VARSUBSTITUTION_ENABLED; la sustitución se aplica también a los comentarios: no escribir
# la sintaxis de variable en ellos).
realm: petpassport
enabled: true
displayName: PetPassport

# --- Registro, login y recuperación (04 §1, §4) ---
registrationAllowed: true
registrationEmailAsUsername: true
loginWithEmailAllowed: true
duplicateEmailsAllowed: false
verifyEmail: true
resetPasswordAllowed: true
rememberMe: false
editUsernameAllowed: false
sslRequired: external

# Política de contraseñas (IAM-004). La blacklist de 100k contraseñas se monta como
# archivo del tema en M1.5 (passwordBlacklist(...) requiere el fichero en data/password-blacklists).
passwordPolicy: "length(12) and upperCase(1) and lowerCase(1) and digits(1) and notUsername and notEmail and passwordHistory(3) and hashAlgorithm(argon2)"

# --- Fuerza bruta (IAM-005) ---
bruteForceProtected: true
permanentLockout: false
failureFactor: 5
waitIncrementSeconds: 60
maxFailureWaitSeconds: 900
maxDeltaTimeSeconds: 43200
quickLoginCheckMilliSeconds: 1000
minimumQuickLoginWaitSeconds: 60

# --- MFA (IAM-005): TOTP 6 dígitos, 30 s, 1 ventana de tolerancia ---
otpPolicyType: totp
otpPolicyAlgorithm: HmacSHA1
otpPolicyDigits: 6
otpPolicyPeriod: 30
otpPolicyLookAheadWindow: 1
otpSupportedApplications: [totpAppFreeOTPName, totpAppGoogleName, totpAppMicrosoftAuthenticatorName]

# Flujo browser propio: cookie SSO o formulario usuario/contraseña, seguido de
#   (a) OTP OBLIGATORIA si el usuario tiene el rol super_admin (si aún no la
#       configuró, Keycloak exige CONFIGURE_TOTP en ese mismo login), o
#   (b) OTP opcional para el resto: solo si el usuario la configuró en "Mi cuenta".
# Las condiciones de un subflujo CONDITIONAL se combinan con AND; (b) niega el rol
# para no pedir la OTP dos veces a un super_admin.
browserFlow: browser-petpassport
authenticationFlows:
  - alias: browser-petpassport
    description: Browser con OTP obligatoria para super_admin (IAM-005)
    providerId: basic-flow
    topLevel: true
    builtIn: false
    authenticationExecutions:
      - authenticator: auth-cookie
        authenticatorFlow: false
        requirement: ALTERNATIVE
        priority: 10
        userSetupAllowed: false
      - authenticatorFlow: true
        flowAlias: browser-petpassport-forms
        requirement: ALTERNATIVE
        priority: 20
        userSetupAllowed: false
  - alias: browser-petpassport-forms
    description: Usuario/contraseña y segundo factor
    providerId: basic-flow
    topLevel: false
    builtIn: false
    authenticationExecutions:
      - authenticator: auth-username-password-form
        authenticatorFlow: false
        requirement: REQUIRED
        priority: 10
        userSetupAllowed: false
      - authenticatorFlow: true
        flowAlias: browser-petpassport-otp-super-admin
        requirement: CONDITIONAL
        priority: 20
        userSetupAllowed: false
      - authenticatorFlow: true
        flowAlias: browser-petpassport-otp-optional
        requirement: CONDITIONAL
        priority: 30
        userSetupAllowed: false
  - alias: browser-petpassport-otp-super-admin
    description: OTP obligatoria para super_admin
    providerId: basic-flow
    topLevel: false
    builtIn: false
    authenticationExecutions:
      - authenticator: conditional-user-role
        authenticatorFlow: false
        authenticatorConfig: cond-role-super-admin
        requirement: REQUIRED
        priority: 10
        userSetupAllowed: false
      - authenticator: auth-otp-form
        authenticatorFlow: false
        requirement: REQUIRED
        priority: 20
        userSetupAllowed: false
  - alias: browser-petpassport-otp-optional
    description: OTP opcional para quien la configuró (no super_admin)
    providerId: basic-flow
    topLevel: false
    builtIn: false
    authenticationExecutions:
      - authenticator: conditional-user-configured
        authenticatorFlow: false
        requirement: REQUIRED
        priority: 10
        userSetupAllowed: false
      - authenticator: conditional-user-role
        authenticatorFlow: false
        authenticatorConfig: cond-role-not-super-admin
        requirement: REQUIRED
        priority: 20
        userSetupAllowed: false
      - authenticator: auth-otp-form
        authenticatorFlow: false
        requirement: REQUIRED
        priority: 30
        userSetupAllowed: false
authenticatorConfig:
  - alias: cond-role-super-admin
    config:
      condUserRole: super_admin
      negate: "false"
  - alias: cond-role-not-super-admin
    config:
      condUserRole: super_admin
      negate: "true"
# CONFIGURE_TOTP y VERIFY_EMAIL son required actions habilitadas por defecto en
# Keycloak; no se declaran aquí porque el modo "managed full" de
# keycloak-config-cli eliminaría las no listadas (p. ej. UPDATE_PASSWORD).

# --- Tiempos de vida (IAM-006) ---
accessTokenLifespan: 300
ssoSessionIdleTimeout: 1800
ssoSessionMaxLifespan: 36000
revokeRefreshToken: true
refreshTokenMaxReuse: 0
accessCodeLifespanLogin: 1800
actionTokenGeneratedByUserLifespan: 1800
actionTokenGeneratedByAdminLifespan: 43200
offlineSessionIdleTimeout: 2592000
attributes:
  actionTokenGeneratedByUserLifespan.verify-email: "43200"
  actionTokenGeneratedByUserLifespan.reset-credentials: "1800"

# --- Tema, correo e internacionalización (IAM-012) ---
# Tema infra/keycloak/themes/petpassport montado en /opt/keycloak/themes.
loginTheme: petpassport
emailTheme: petpassport
internationalizationEnabled: true
supportedLocales: [es, en]
defaultLocale: es

# --- Eventos ---
eventsEnabled: true
eventsExpiration: 2592000
enabledEventTypes: [LOGIN, LOGIN_ERROR, LOGOUT, REGISTER, REGISTER_ERROR, UPDATE_PASSWORD, RESET_PASSWORD, SEND_RESET_PASSWORD, VERIFY_EMAIL, UPDATE_EMAIL, UPDATE_TOTP, REMOVE_TOTP]
adminEventsEnabled: true
adminEventsDetailsEnabled: true

# --- SMTP (IAM-012): dev = Mailpit sin auth; staging/prod = proveedor transaccional con
# STARTTLS y credenciales desde el entorno de keycloak-config (nunca en el repo).
# Remitente no-reply del dominio, con SPF/DKIM/DMARC (infra/waf/cloudflare, RUNBOOK §13).
smtpServer:
  host: $(env:PP_SMTP_HOST)
  port: $(env:PP_SMTP_PORT)
  from: $(env:PP_SMTP_FROM)
  fromDisplayName: PetPassport
  replyTo: $(env:PP_SMTP_FROM)
  auth: "$(env:PP_SMTP_AUTH)"
  user: $(env:PP_SMTP_USER)
  password: $(env:PP_SMTP_PASSWORD)
  ssl: "false"
  starttls: "$(env:PP_SMTP_STARTTLS)"

# --- Roles de realm (IAM-003) ---
roles:
  realm:
    - name: pet_owner
      description: Toda persona puede ser tutor de mascotas. Asignado por defecto.
    - name: super_admin
      description: Administración de la plataforma. Asignación manual, nunca por auto-registro.
defaultRole:
  name: default-roles-petpassport
  composite: true
  composites:
    realm: [pet_owner, offline_access, uma_authorization]

# --- Client scope de audiencia (IAM-002) ---
clientScopes:
  - name: petpassport-api-audience
    description: Añade la audiencia petpassport-api al access token.
    protocol: openid-connect
    attributes:
      include.in.token.scope: "false"
      display.on.consent.screen: "false"
    protocolMappers:
      - name: petpassport-api-audience
        protocol: openid-connect
        protocolMapper: oidc-audience-mapper
        consentRequired: false
        config:
          included.client.audience: petpassport-api
          id.token.claim: "false"
          access.token.claim: "true"

# --- Clients (IAM-002) ---
clients:
  - clientId: petpassport-web
    name: PetPassport Web
    description: SPA Vue. Authorization Code + PKCE S256. Sin implicit ni direct grant.
    enabled: true
    publicClient: true
    protocol: openid-connect
    standardFlowEnabled: true
    implicitFlowEnabled: false
    directAccessGrantsEnabled: false
    serviceAccountsEnabled: false
    fullScopeAllowed: false
    rootUrl: $(env:PP_WEB_ORIGIN)
    baseUrl: /
    redirectUris:
      - $(env:PP_WEB_ORIGIN)/auth/callback
      - $(env:PP_WEB_ORIGIN_DEV)/auth/callback
    webOrigins:
      - $(env:PP_WEB_ORIGIN)
      - $(env:PP_WEB_ORIGIN_DEV)
    attributes:
      pkce.code.challenge.method: S256
      post.logout.redirect.uris: "$(env:PP_WEB_ORIGIN)/auth/logout##$(env:PP_WEB_ORIGIN_DEV)/auth/logout"
      access.token.lifespan: "300"
    defaultClientScopes: [openid, profile, email, roles, petpassport-api-audience]
    optionalClientScopes: []

  - clientId: petpassport-api
    name: PetPassport API
    description: Existe solo como audiencia. Sin flujos habilitados (bearer-only).
    enabled: true
    publicClient: false
    bearerOnly: true
    protocol: openid-connect
    standardFlowEnabled: false
    implicitFlowEnabled: false
    directAccessGrantsEnabled: false
    serviceAccountsEnabled: false

  - clientId: petpassport-backend
    name: PetPassport Backend (service account)
    description: Operaciones administrativas puntuales vía Admin API (IAM-011). Mínimo privilegio.
    enabled: true
    publicClient: false
    protocol: openid-connect
    clientAuthenticatorType: client-secret
    secret: $(env:PP_BACKEND_CLIENT_SECRET)
    standardFlowEnabled: false
    implicitFlowEnabled: false
    directAccessGrantsEnabled: false
    serviceAccountsEnabled: true
    fullScopeAllowed: false

# Roles de realm-management de la service account (solo lo necesario, IAM-011).
users:
  - username: service-account-petpassport-backend
    serviceAccountClientId: petpassport-backend
    enabled: true
    clientRoles:
      realm-management: [view-users, manage-users]

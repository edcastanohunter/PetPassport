# Alertas mínimas de staging (docs/phase-1/09 §7, PP-F1-INF-007). Cada una
# enlaza su sección del runbook (infra/deploy/RUNBOOK.md §7).
groups:
  - name: petpassport
    rules:
      - alert: ApiHigh5xxRate
        expr: |
          sum(rate(http_server_requests_total{status=~"5.."}[5m]))
            / sum(rate(http_server_requests_total[5m])) > 0.01
        for: 5m
        labels: { severity: page }
        annotations:
          summary: "Error rate 5xx > 1% (5 min): {{ $value | humanizePercentage }}"
          runbook: "infra/deploy/RUNBOOK.md#71-apihigh5xxrate"
      - alert: ApiHighLatencyP95
        expr: |
          histogram_quantile(0.95, sum by (le) (rate(http_server_request_duration_seconds_bucket[5m]))) > 0.5
        for: 10m
        labels: { severity: page }
        annotations:
          summary: "p95 > 500 ms (10 min): {{ $value | humanizeDuration }}"
          runbook: "infra/deploy/RUNBOOK.md#72-apihighlatencyp95"
      - alert: ApiNotReady
        expr: min(probe_success{job="readyz"}) == 0 or absent(probe_success{job="readyz"})
        for: 2m
        labels: { severity: page }
        annotations:
          summary: "/readyz caído 2 min"
          runbook: "infra/deploy/RUNBOOK.md#73-apinotready"
      - alert: OutboxPendingGrowing
        # Con consumidor desde F2 M2.0 (ARQ-008): crecimiento sostenido = consumidor
        # atascado o caído. OutboxStuck (edad del más antiguo, INF-003) llega en M2.4.
        expr: delta(outbox_pending[1h]) > 0 and min_over_time(outbox_pending[1h]) > 0
        for: 1h
        labels: { severity: info }
        annotations:
          summary: "outbox_pending crece desde hace > 1 h ({{ $value }} en la última hora)"
          runbook: "infra/deploy/RUNBOOK.md#74-outboxpendinggrowing"
      - alert: CertificateExpiringSoon
        expr: (min by (instance) (probe_ssl_earliest_cert_expiry) - time()) / 86400 < 14
        for: 1h
        labels: { severity: ticket }
        annotations:
          summary: "Certificado de {{ $labels.instance }} caduca en {{ $value | humanize }} días"
          runbook: "infra/deploy/RUNBOOK.md#75-certificateexpiringsoon"
      - alert: ScrapeTargetDown
        expr: up{job=~"api|worker|keycloak|traefik"} == 0
        for: 5m
        labels: { severity: ticket }
        annotations:
          summary: "Prometheus no puede leer {{ $labels.job }}"
          runbook: "infra/deploy/RUNBOOK.md#76-scrapetargetdown"

  # F2 M2.0: worker y proyecciones asíncronas (ADR-009; PP-F2-ARQ-001/003/007,
  # INF-002) y alertas de lag, outbox, recordatorios y PDF (INF-003, M2.4).
  - name: petpassport-worker
    rules:
      - alert: ProjectionFailed
        expr: max by (name) (projection_status{status="failed"}) == 1
        labels: { severity: page }
        annotations:
          summary: "Proyección {{ $labels.name }} detenida (fail-stop): read model sin actualizar"
          runbook: "infra/deploy/RUNBOOK.md#77-projectionfailed"
      - alert: WorkerDown
        expr: max(worker_instance_lock) == 0 or absent(worker_instance_lock)
        for: 2m
        labels: { severity: page }
        annotations:
          summary: "Ningún worker tiene el lock de instancia desde hace 2 min"
          runbook: "infra/deploy/RUNBOOK.md#78-workerdown"
      - alert: AppendLockContention
        expr: |
          histogram_quantile(0.95, sum by (le) (rate(eventstore_append_lock_wait_seconds_bucket[5m]))) > 0.02
        for: 10m
        labels: { severity: ticket }
        annotations:
          summary: "p95 de espera del lock de orden total > 20 ms (10 min): {{ $value | humanizeDuration }}"
          runbook: "infra/deploy/RUNBOOK.md#79-appendlockcontention"
      - alert: ProjectionLagHigh
        expr: max by (name) (projection_lag_seconds) > 60
        for: 5m
        labels: { severity: ticket }
        annotations:
          summary: "Proyección {{ $labels.name }} con retraso > 60 s (5 min): {{ $value | humanizeDuration }}"
          runbook: "infra/deploy/RUNBOOK.md#710-projectionlaghigh"
      - alert: OutboxStuck
        expr: max(outbox_age_seconds) > 300
        labels: { severity: page }
        annotations:
          summary: "El evento más antiguo del outbox lleva {{ $value | humanizeDuration }} sin procesarse"
          runbook: "infra/deploy/RUNBOOK.md#711-outboxstuck"
      - alert: OutboxDeadLetter
        expr: sum(increase(outbox_dead_letter_total[15m])) > 0
        labels: { severity: page }
        annotations:
          summary: "Eventos del outbox enviados a dead-letter en los últimos 15 min"
          runbook: "infra/deploy/RUNBOOK.md#712-outboxdeadletter"
      - alert: ReminderDelay
        expr: |
          histogram_quantile(0.95, sum by (le) (rate(reminder_dispatch_delay_seconds_bucket[10m]))) > 60
        for: 10m
        labels: { severity: page }
        annotations:
          summary: "p95 del retraso de despacho de recordatorios > 60 s: {{ $value | humanizeDuration }}"
          runbook: "infra/deploy/RUNBOOK.md#713-reminderdelay"
      - alert: NotificationDeadLetter
        expr: sum(increase(notifications_dead_letter_total[1h])) > 10
        labels: { severity: ticket }
        annotations:
          summary: "Más de 10 notificaciones agotaron reintentos en 1 h: {{ $value | printf \"%.0f\" }}"
          runbook: "infra/deploy/RUNBOOK.md#714-notificationdeadletter"
      - alert: DocumentRenderFailures
        expr: sum(increase(document_render_duration_seconds_count{outcome="failed"}[1h])) > 5
        labels: { severity: ticket }
        annotations:
          summary: "Más de 5 documentos PDF fallaron en 1 h: {{ $value | printf \"%.0f\" }}"
          runbook: "infra/deploy/RUNBOOK.md#715-documentrenderfailures"

  # F3 M3.3: Búsqueda OpenSearch, Redis, Asynq, Leases, SLOs y Seguridad (PP-F3-INF-004)
  - name: petpassport-f3
    rules:
      - alert: SearchIndexLagHigh
        expr: max by (index) (search_index_lag_seconds) > 30
        for: 5m
        labels: { severity: ticket }
        annotations:
          summary: "Retraso de indexación en {{ $labels.index }} > 30 s (5 min): {{ $value | humanizeDuration }}"
          runbook: "infra/deploy/RUNBOOK.md#716-searchindexlaghigh"
      - alert: SearchDegraded
        expr: |
          sum(rate(search_degraded_requests_total[5m]))
            / (sum(rate(http_server_requests_total{route=~"/api/v1/(search|suggest).*"}[5m])) + 0.001) > 0.05
        for: 5m
        labels: { severity: page }
        annotations:
          summary: "Búsqueda degradada a PostgreSQL > 5% de peticiones (5 min): {{ $value | humanizePercentage }}"
          runbook: "infra/deploy/RUNBOOK.md#717-searchdegraded"
      - alert: SearchPostfilterDrops
        expr: sum(rate(search_postfilter_dropped_total[10m])) > 0
        for: 10m
        labels: { severity: ticket }
        annotations:
          summary: "Discrepancias de autorización en post-filtro de búsqueda durante > 10 min: {{ $value }}"
          runbook: "infra/deploy/RUNBOOK.md#718-searchpostfilterdrops"
      - alert: RedisMemoryHigh
        expr: redis_memory_used_bytes / redis_memory_max_bytes > 0.80
        for: 5m
        labels: { severity: page }
        annotations:
          summary: "Uso de memoria de Redis > 80%: {{ $value | humanizePercentage }}"
          runbook: "infra/deploy/RUNBOOK.md#719-redismemoryhigh"
      - alert: RedisDown
        expr: redis_up == 0 or absent(redis_up)
        for: 2m
        labels: { severity: page }
        annotations:
          summary: "Instancia Redis no disponible desde hace > 2 min"
          runbook: "infra/deploy/RUNBOOK.md#720-redisdown"
      - alert: RateLimitFailOpen
        expr: sum(increase(ratelimit_bypass_total[5m])) > 0
        labels: { severity: ticket }
        annotations:
          summary: "Rate limiting operando en fail-open por indisponibilidad de Redis: {{ $value }}"
          runbook: "infra/deploy/RUNBOOK.md#721-ratelimitfailopen"
      - alert: AsynqQueueBacklog
        expr: asynq_queue_size{queue="default"} > 5000 or asynq_queue_size{queue="critical"} > 500
        for: 5m
        labels: { severity: page }
        annotations:
          summary: "Backlog excesivo en cola Asynq {{ $labels.queue }}: {{ $value }} tareas"
          runbook: "infra/deploy/RUNBOOK.md#722-asynqqueuebacklog"
      - alert: AsynqArchived
        expr: sum(increase(asynq_tasks_archived_total[1h])) > 10
        labels: { severity: ticket }
        annotations:
          summary: "Más de 10 tareas Asynq enviadas a la DLQ (archived) en 1 h: {{ $value }}"
          runbook: "infra/deploy/RUNBOOK.md#723-asynqarchived"
      - alert: LeaseTakeoverStorm
        expr: sum(increase(worker_lease_takeovers_total[5m])) > 5
        labels: { severity: page }
        annotations:
          summary: "Más de 5 cambios de titularidad de leases de worker en 5 min (inestabilidad de workers)"
          runbook: "infra/deploy/RUNBOOK.md#724-leasetakeoverstorm"
      - alert: SLOBurnRateHigh
        expr: |
          ((sum(rate(http_server_requests_total{status=~"5.."}[1h])) / sum(rate(http_server_requests_total[1h]))) / (1 - 0.999) > 14)
          or
          ((sum(rate(http_server_requests_total{status=~"5.."}[6h])) / sum(rate(http_server_requests_total[6h]))) / (1 - 0.999) > 6)
        labels: { severity: page }
        annotations:
          summary: "Consumo acelerado de error budget del SLO de disponibilidad (14x en 1h o 6x en 6h)"
          runbook: "infra/deploy/RUNBOOK.md#725-sloburnratehigh"
      - alert: ClamAVDefinitionsStale
        expr: (time() - clamav_definitions_updated_timestamp_seconds) > 172800
        for: 1h
        labels: { severity: ticket }
        annotations:
          summary: "Definiciones de firmas de ClamAV desactualizadas desde hace > 48 h"
          runbook: "infra/deploy/RUNBOOK.md#726-clamavdefinitionsstale"
      - alert: MappingDrift
        expr: search_mapping_drift == 1
        for: 15m
        labels: { severity: ticket }
        annotations:
          summary: "Divergencia detectada entre mappings del repositorio y esquemas activos en OpenSearch"
          runbook: "infra/deploy/RUNBOOK.md#727-mappingdrift"


# Alertas mínimas de staging (docs/phase-1/09 §7, PP-F1-INF-007). Cada una
# enlaza su sección del runbook (infra/deploy/RUNBOOK.md §7).
groups:
  - name: petpassport
    rules:
      - alert: ApiHigh5xxRate
        expr: |
          sum(rate(http_server_requests_total{status=~"5.."}[5m]))
            / sum(rate(http_server_requests_total[5m])) > 0.01
        for: 5m
        labels: { severity: page }
        annotations:
          summary: "Error rate 5xx > 1% (5 min): {{ $value | humanizePercentage }}"
          runbook: "infra/deploy/RUNBOOK.md#71-apihigh5xxrate"
      - alert: ApiHighLatencyP95
        expr: |
          histogram_quantile(0.95, sum by (le) (rate(http_server_request_duration_seconds_bucket[5m]))) > 0.5
        for: 10m
        labels: { severity: page }
        annotations:
          summary: "p95 > 500 ms (10 min): {{ $value | humanizeDuration }}"
          runbook: "infra/deploy/RUNBOOK.md#72-apihighlatencyp95"
      - alert: ApiNotReady
        expr: min(probe_success{job="readyz"}) == 0 or absent(probe_success{job="readyz"})
        for: 2m
        labels: { severity: page }
        annotations:
          summary: "/readyz caído 2 min"
          runbook: "infra/deploy/RUNBOOK.md#73-apinotready"
      - alert: OutboxPendingGrowing
        # Con consumidor desde F2 M2.0 (ARQ-008): crecimiento sostenido = consumidor
        # atascado o caído. OutboxStuck (edad del más antiguo, INF-003) llega en M2.4.
        expr: delta(outbox_pending[1h]) > 0 and min_over_time(outbox_pending[1h]) > 0
        for: 1h
        labels: { severity: info }
        annotations:
          summary: "outbox_pending crece desde hace > 1 h ({{ $value }} en la última hora)"
          runbook: "infra/deploy/RUNBOOK.md#74-outboxpendinggrowing"
      - alert: CertificateExpiringSoon
        expr: (min by (instance) (probe_ssl_earliest_cert_expiry) - time()) / 86400 < 14
        for: 1h
        labels: { severity: ticket }
        annotations:
          summary: "Certificado de {{ $labels.instance }} caduca en {{ $value | humanize }} días"
          runbook: "infra/deploy/RUNBOOK.md#75-certificateexpiringsoon"
      - alert: ScrapeTargetDown
        expr: up{job=~"api|worker|keycloak|traefik"} == 0
        for: 5m
        labels: { severity: ticket }
        annotations:
          summary: "Prometheus no puede leer {{ $labels.job }}"
          runbook: "infra/deploy/RUNBOOK.md#76-scrapetargetdown"

  # F2 M2.0: worker y proyecciones asíncronas (ADR-009; PP-F2-ARQ-001/003/007,
  # INF-002) y alertas de lag, outbox, recordatorios y PDF (INF-003, M2.4).
  - name: petpassport-worker
    rules:
      - alert: ProjectionFailed
        expr: max by (name) (projection_status{status="failed"}) == 1
        labels: { severity: page }
        annotations:
          summary: "Proyección {{ $labels.name }} detenida (fail-stop): read model sin actualizar"
          runbook: "infra/deploy/RUNBOOK.md#77-projectionfailed"
      - alert: WorkerDown
        expr: max(worker_instance_lock) == 0 or absent(worker_instance_lock)
        for: 2m
        labels: { severity: page }
        annotations:
          summary: "Ningún worker tiene el lock de instancia desde hace 2 min"
          runbook: "infra/deploy/RUNBOOK.md#78-workerdown"
      - alert: AppendLockContention
        expr: |
          histogram_quantile(0.95, sum by (le) (rate(eventstore_append_lock_wait_seconds_bucket[5m]))) > 0.02
        for: 10m
        labels: { severity: ticket }
        annotations:
          summary: "p95 de espera del lock de orden total > 20 ms (10 min): {{ $value | humanizeDuration }}"
          runbook: "infra/deploy/RUNBOOK.md#79-appendlockcontention"
      - alert: ProjectionLagHigh
        expr: max by (name) (projection_lag_seconds) > 60
        for: 5m
        labels: { severity: ticket }
        annotations:
          summary: "Proyección {{ $labels.name }} con retraso > 60 s (5 min): {{ $value | humanizeDuration }}"
          runbook: "infra/deploy/RUNBOOK.md#710-projectionlaghigh"
      - alert: OutboxStuck
        expr: max(outbox_age_seconds) > 300
        labels: { severity: page }
        annotations:
          summary: "El evento más antiguo del outbox lleva {{ $value | humanizeDuration }} sin procesarse"
          runbook: "infra/deploy/RUNBOOK.md#711-outboxstuck"
      - alert: OutboxDeadLetter
        expr: sum(increase(outbox_dead_letter_total[15m])) > 0
        labels: { severity: page }
        annotations:
          summary: "Eventos del outbox enviados a dead-letter en los últimos 15 min"
          runbook: "infra/deploy/RUNBOOK.md#712-outboxdeadletter"
      - alert: ReminderDelay
        expr: |
          histogram_quantile(0.95, sum by (le) (rate(reminder_dispatch_delay_seconds_bucket[10m]))) > 60
        for: 10m
        labels: { severity: page }
        annotations:
          summary: "p95 del retraso de despacho de recordatorios > 60 s: {{ $value | humanizeDuration }}"
          runbook: "infra/deploy/RUNBOOK.md#713-reminderdelay"
      - alert: NotificationDeadLetter
        expr: sum(increase(notifications_dead_letter_total[1h])) > 10
        labels: { severity: ticket }
        annotations:
          summary: "Más de 10 notificaciones agotaron reintentos en 1 h: {{ $value | printf \"%.0f\" }}"
          runbook: "infra/deploy/RUNBOOK.md#714-notificationdeadletter"
      - alert: DocumentRenderFailures
        expr: sum(increase(document_render_duration_seconds_count{outcome="failed"}[1h])) > 5
        labels: { severity: ticket }
        annotations:
          summary: "Más de 5 documentos PDF fallaron en 1 h: {{ $value | printf \"%.0f\" }}"
          runbook: "infra/deploy/RUNBOOK.md#715-documentrenderfailures"

# Prometheus de dev y staging (docs/phase-1/09 §7, PP-F1-INF-007).
# ${PP_ENV} se expande con --enable-feature=expand-external-labels.
global:
  scrape_interval: 15s
  evaluation_interval: 30s
  external_labels:
    env: ${PP_ENV}

rule_files:
  - /etc/prometheus/alerts.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

scrape_configs:
  - job_name: api
    static_configs:
      - targets: ["api:9090"]
  # Worker (F2 M2.0, INF-002): proyecciones, outbox, scheduler de comandos.
  - job_name: worker
    static_configs:
      - targets: ["worker:9090"]
  - job_name: keycloak
    metrics_path: /metrics
    static_configs:
      - targets: ["keycloak:9000"]
  - job_name: traefik
    static_configs:
      - targets: ["traefik:8080"]

  # readyz del listener interno (alerta ApiNotReady).
  - job_name: readyz
    metrics_path: /probe
    params: { module: [http_2xx] }
    static_configs:
      - targets: ["http://api:9090/readyz"]
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: blackbox:9115

  # Certificados públicos (alerta CertificateExpiringSoon). deploy.sh escribe
  # las URLs del entorno en targets/tls.json; en dev el directorio está vacío.
  - job_name: tls
    metrics_path: /probe
    params: { module: [https_2xx] }
    file_sd_configs:
      - files: ["/etc/prometheus/targets/*.json"]
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: blackbox:9115

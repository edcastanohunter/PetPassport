# Alertmanager (PP-F1-INF-007). El webhook del canal del equipo se lee de un
# fichero montado (nunca en el repo): en staging lo escribe deploy.sh desde
# ALERT_SLACK_WEBHOOK_URL; en dev apunta a un destino nulo.
route:
  receiver: team
  group_by: [alertname]
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h
  routes:
    - matchers: ['severity="info"']
      receiver: team
      repeat_interval: 24h
receivers:
  - name: team
    slack_configs:
      - api_url_file: /etc/alertmanager/secrets/slack_webhook_url
        send_resolved: true
        title: '[{{ .CommonLabels.env }}] {{ .CommonLabels.alertname }} ({{ .Status }})'
        text: '{{ range .Alerts }}{{ .Annotations.summary }} · {{ .Annotations.runbook }}{{ "\n" }}{{ end }}'

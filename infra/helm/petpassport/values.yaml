# Default values for petpassport (PP-F3-ARQ-012, ARQ-013, INF-005, F5 INF-001, INF-002, OPS-001, OPS-002, OPS-010).

global:
  env: staging
  domain: staging.petpassport.app

# Nombre de un Secret preexistente de Kubernetes para inyectar credenciales sensibles (PP_DB_PASSWORD, PP_REDIS_PASSWORD, etc.)
existingSecret: ""

image:
  repository: localhost/petpassport
  tag: "0.5.0"
  pullPolicy: IfNotPresent

api:
  replicaCount: 2
  port: 8080
  internalPort: 9090
  resources:
    limits:
      cpu: 1000m
      memory: 512Mi
    requests:
      cpu: 200m
      memory: 256Mi
  hpa:
    enabled: true
    minReplicas: 2
    maxReplicas: 5
    targetCPUUtilizationPercentage: 70
  pdb:
    enabled: true
    minAvailable: 1

worker:
  replicaCount: 2
  internalPort: 9090
  resources:
    limits:
      cpu: 1000m
      memory: 512Mi
    requests:
      cpu: 200m
      memory: 256Mi
  pdb:
    enabled: true
    minAvailable: 1

frontend:
  replicaCount: 2
  port: 80
  resources:
    limits:
      cpu: 200m
      memory: 128Mi
    requests:
      cpu: 50m
      memory: 64Mi

ingress:
  enabled: true
  className: traefik
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
    traefik.ingress.kubernetes.io/router.tls: "true"
  hosts:
    - host: app.staging.petpassport.app
      paths:
        - path: /
          pathType: Prefix
          service: frontend
    - host: api.staging.petpassport.app
      paths:
        - path: /
          pathType: Prefix
          service: api

redis:
  addr: "redis:6379"
  useTLS: false

database:
  host: "postgres"
  maxConns: 10

oidc:
  issuer: "https://auth.staging.petpassport.app/realms/petpassport"
  audience: "petpassport-api"
  allowedAZP: "petpassport-web"

networkPolicy:
  enabled: false

externalSecrets:
  enabled: false
  awsRegion: us-east-1
  refreshInterval: 1h
  remoteKey: "petpassport/staging"

admissionPolicy:
  enabled: false
  cosignPublicKey: ""

canary:
  enabled: false

pgbouncer:
  enabled: false
  replicaCount: 2
  image: "edoburu/pgbouncer:v1.23.1"

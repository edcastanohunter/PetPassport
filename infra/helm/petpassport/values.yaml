# Default values for petpassport (PP-F3-ARQ-012, ARQ-013, INF-005).

global:
  env: staging
  domain: staging.petpassport.app

image:
  repository: localhost/petpassport
  tag: "0.3.0"
  pullPolicy: IfNotPresent

api:
  replicaCount: 2
  port: 8080
  internalPort: 9090
  resources:
    limits:
      cpu: 1000m
      memory: 512Mi
    requests:
      cpu: 200m
      memory: 256Mi
  hpa:
    enabled: true
    minReplicas: 2
    maxReplicas: 5
    targetCPUUtilizationPercentage: 70
  pdb:
    enabled: true
    minAvailable: 1

worker:
  replicaCount: 2
  internalPort: 9090
  resources:
    limits:
      cpu: 1000m
      memory: 512Mi
    requests:
      cpu: 200m
      memory: 256Mi
  pdb:
    enabled: true
    minAvailable: 1

frontend:
  replicaCount: 2
  port: 80
  resources:
    limits:
      cpu: 200m
      memory: 128Mi
    requests:
      cpu: 50m
      memory: 64Mi

ingress:
  enabled: true
  className: traefik
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
    traefik.ingress.kubernetes.io/router.tls: "true"
  hosts:
    - host: app.staging.petpassport.app
      paths:
        - path: /
          pathType: Prefix
          service: frontend
    - host: api.staging.petpassport.app
      paths:
        - path: /
          pathType: Prefix
          service: api

redis:
  addr: "redis:6379"
  useTLS: false

database:
  maxConns: 10

oidc:
  issuer: "https://auth.staging.petpassport.app/realms/petpassport"
  audience: "petpassport-api"
  allowedAZP: "petpassport-web"

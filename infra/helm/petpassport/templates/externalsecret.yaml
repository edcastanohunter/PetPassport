{{- if .Values.externalSecrets.enabled }}
apiVersion: external-secrets.io/v1beta1
kind: SecretStore
metadata:
  name: {{ include "petpassport.fullname" . }}-secretstore
  labels:
    {{- include "petpassport.labels" . | nindent 4 }}
spec:
  provider:
    aws:
      service: SecretsManager
      region: {{ .Values.externalSecrets.awsRegion | default "us-east-1" }}
      auth:
        jwt:
          serviceAccountRef:
            name: {{ include "petpassport.fullname" . }}-sa
---
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: {{ include "petpassport.fullname" . }}-secrets
  labels:
    {{- include "petpassport.labels" . | nindent 4 }}
spec:
  refreshInterval: {{ .Values.externalSecrets.refreshInterval | default "1h" }}
  secretStoreRef:
    name: {{ include "petpassport.fullname" . }}-secretstore
    kind: SecretStore
  target:
    name: {{ include "petpassport.fullname" . }}-app-secrets
    creationPolicy: Owner
  data:
    - secretKey: PP_DB_PASSWORD
      remoteRef:
        key: {{ .Values.externalSecrets.remoteKey }}
        property: db_password
    - secretKey: PP_REDIS_PASSWORD
      remoteRef:
        key: {{ .Values.externalSecrets.remoteKey }}
        property: redis_password
    - secretKey: PP_KMS_KEK_ID
      remoteRef:
        key: {{ .Values.externalSecrets.remoteKey }}
        property: kms_kek_id
    - secretKey: PP_INTERNAL_TOKEN_KEY
      remoteRef:
        key: {{ .Values.externalSecrets.remoteKey }}
        property: internal_token_key
{{- end }}

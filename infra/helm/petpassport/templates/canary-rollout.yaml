{{- if .Values.canary.enabled }}
apiVersion: argoproj.io/v1alpha1
kind: Rollout
metadata:
  name: {{ include "petpassport.fullname" . }}-api
  labels:
    {{- include "petpassport.labels" . | nindent 4 }}
    app.kubernetes.io/component: api
spec:
  replicas: {{ .Values.api.replicaCount }}
  strategy:
    canary:
      canaryService: {{ include "petpassport.fullname" . }}-api-canary
      stableService: {{ include "petpassport.fullname" . }}-api
      trafficRouting:
        traefik:
          weightedTraefikServiceName: {{ include "petpassport.fullname" . }}-api-wts
      steps:
        - setWeight: 10
        - pause: { duration: 15m } # 10 % de tráfico 15 min con comparación automática (OPS-010)
      analysis:
        templates:
          - templateName: {{ include "petpassport.fullname" . }}-api-health
        args:
          - name: service-name
            value: {{ include "petpassport.fullname" . }}-api-canary
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "petpassport.name" . }}
      app.kubernetes.io/instance: {{ .Release.Name }}
      app.kubernetes.io/component: api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ include "petpassport.name" . }}
        app.kubernetes.io/instance: {{ .Release.Name }}
        app.kubernetes.io/component: api
    spec:
      priorityClassName: {{ include "petpassport.fullname" . }}-high-priority
      terminationGracePeriodSeconds: 60
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: DoNotSchedule
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: {{ include "petpassport.name" . }}
              app.kubernetes.io/component: api
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: api
          image: "{{ .Values.image.repository }}-backend:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          ports:
            - name: http
              containerPort: {{ .Values.api.port }}
              protocol: TCP
            - name: internal
              containerPort: {{ .Values.api.internalPort }}
              protocol: TCP
          envFrom:
            - configMapRef:
                name: {{ include "petpassport.fullname" . }}-config
            {{- if .Values.existingSecret }}
            - secretRef:
                name: {{ .Values.existingSecret }}
            {{- end }}
          livenessProbe:
            httpGet:
              path: /healthz
              port: internal
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /readyz
              port: internal
            initialDelaySeconds: 5
            periodSeconds: 5
          resources:
            {{- toYaml .Values.api.resources | nindent 12 }}
---
apiVersion: argoproj.io/v1alpha1
kind: AnalysisTemplate
metadata:
  name: {{ include "petpassport.fullname" . }}-api-health
  labels:
    {{- include "petpassport.labels" . | nindent 4 }}
spec:
  metrics:
    - name: success-rate
      interval: 1m
      successCondition: result[0] >= 0.99
      failureLimit: 3
      provider:
        prometheus:
          address: "http://prometheus:9090"
          query: |
            sum(rate(http_requests_total{status!~"5.*"}[1m]))
            /
            sum(rate(http_requests_total[1m]))
    - name: p95-latency
      interval: 1m
      successCondition: result[0] <= 0.300 # p95 < 300ms (SLO F3)
      failureLimit: 3
      provider:
        prometheus:
          address: "http://prometheus:9090"
          query: |
            histogram_quantile(0.95, sum(rate(http_request_duration_seconds_bucket[1m])) by (le))
{{- end }}

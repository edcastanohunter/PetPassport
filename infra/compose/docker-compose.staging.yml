# Staging (docs/phase-1/09 §5–6, INF-005/INF-006; ADR-006/ADR-008).
# No se usa a mano: lo invoca infra/deploy/deploy.sh <env> <version>, que
# genera las variables desde /etc/petpassport/<env>.env (permisos 600).
#
# Diferencias con dev:
#   - Imágenes inmutables de ghcr.io por versión (misma imagen promovida).
#   - Solo Traefik publica puertos (443). Postgres, SMTP y object storage son
#     gestionados (INF-009) y se alcanzan por variables PP_*.
#   - Traefik sin dashboard; acepta solo tráfico de Cloudflare con la cabecera
#     X-Origin-Auth (SEC-001) y confía en X-Forwarded-* solo de sus rangos.
#   - Contenedores no root, rootfs de solo lectura, no-new-privileges, sin
#     capabilities (SEC-010).
name: petpassport-${PP_ENV:?PP_ENV}

x-hardening: &hardening
  read_only: true
  security_opt: ["no-new-privileges:true"]
  cap_drop: [ALL]
  restart: unless-stopped
  logging:
    driver: json-file
    options: { max-size: "20m", max-file: "5" }

x-api-env: &api-env
  PP_ENV: ${PP_ENV}
  PP_DB_URL: ${PP_DB_URL:?PP_DB_URL}
  PP_DB_MAX_CONNS: ${PP_DB_MAX_CONNS:-20}
  PP_OIDC_ISSUER: https://auth.${PP_DOMAIN}/realms/petpassport
  PP_OIDC_DISCOVERY_URL: http://keycloak:8080/realms/petpassport
  PP_OIDC_AUDIENCE: petpassport-api
  PP_OIDC_ALLOWED_AZP: petpassport-web
  PP_KC_ADMIN_URL: http://keycloak:8080
  PP_KC_ADMIN_CLIENT_ID: petpassport-backend
  PP_KC_ADMIN_CLIENT_SECRET: ${PP_BACKEND_CLIENT_SECRET:?PP_BACKEND_CLIENT_SECRET}
  PP_IP_HASH_SALT: ${PP_IP_HASH_SALT:?PP_IP_HASH_SALT}
  PP_STORAGE_ENDPOINT: ${PP_STORAGE_ENDPOINT:?PP_STORAGE_ENDPOINT}
  PP_STORAGE_BUCKET: ${PP_STORAGE_BUCKET:-petpassport-media}
  PP_STORAGE_ACCESS_KEY: ${PP_STORAGE_ACCESS_KEY:?PP_STORAGE_ACCESS_KEY}
  PP_STORAGE_SECRET_KEY: ${PP_STORAGE_SECRET_KEY:?PP_STORAGE_SECRET_KEY}
  PP_STORAGE_USE_SSL: "true"
  PP_SMTP_HOST: ${PP_SMTP_HOST:?PP_SMTP_HOST}
  PP_SMTP_PORT: ${PP_SMTP_PORT:-587}
  PP_SMTP_USER: ${PP_SMTP_USER:-}
  PP_SMTP_PASSWORD: ${PP_SMTP_PASSWORD:-}
  PP_SMTP_FROM: ${PP_SMTP_FROM:-no-reply@${PP_DOMAIN}}
  PP_CORS_ORIGINS: https://app.${PP_DOMAIN}
  PP_PUBLIC_BASE_URL: https://app.${PP_DOMAIN}
  PP_LOG_LEVEL: info
  PP_OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4318

services:
  traefik:
    image: traefik:v3.3
    <<: *hardening
    command:
      - --providers.file.directory=/etc/traefik/dynamic
      - --providers.file.watch=true
      - --entrypoints.websecure.address=:8443
      - --entrypoints.websecure.transport.respondingTimeouts.readTimeout=30s
      - --entrypoints.websecure.transport.respondingTimeouts.writeTimeout=60s
      - --entrypoints.websecure.transport.respondingTimeouts.idleTimeout=180s
      # X-Forwarded-* solo se respeta si viene de Cloudflare (SEC-002).
      - --entrypoints.websecure.forwardedHeaders.trustedIPs=${CF_TRUSTED_IPS:?CF_TRUSTED_IPS}
      # Forwarding timeout hacia los servicios (SEC-002: api 30 s).
      - --serverstransport.forwardingtimeouts.responseheadertimeout=30s
      # Entrypoint interno "traefik" (:8080, sin publicar): solo /metrics y /ping.
      - --entrypoints.traefik.address=:8080
      - --metrics.prometheus=true
      - --metrics.prometheus.entryPoint=traefik
      - --ping=true
      - --ping.entryPoint=traefik
      - --api.dashboard=false
      - --log.level=INFO
      - --log.format=json
      - --accesslog=true
      - --accesslog.format=json
      - --accesslog.fields.headers.defaultmode=drop
      - --accesslog.fields.headers.names.User-Agent=keep
      - --accesslog.fields.headers.names.CF-Ray=keep
    environment:
      PP_DOMAIN: ${PP_DOMAIN:?PP_DOMAIN}
      PP_ORIGIN_AUTH_SECRET: ${PP_ORIGIN_AUTH_SECRET:?PP_ORIGIN_AUTH_SECRET}
      TEAM_IP_RANGES: ${TEAM_IP_RANGES:?TEAM_IP_RANGES}
    ports:
      - "443:8443"
    volumes:
      - ../traefik/staging:/etc/traefik/dynamic:ro
      # Certificado de origen de Cloudflare (modo Full strict), fuera del repo.
      - ${PP_STATE_DIR:?PP_STATE_DIR}/certs:/etc/traefik/certs:ro
    networks: [edge, default]
    healthcheck:
      test: ["CMD", "traefik", "healthcheck", "--ping", "--ping.entryPoint=traefik", "--entrypoints.traefik.address=:8080"]
      interval: 10s
      timeout: 3s
      retries: 6

  migrate:
    image: ${IMAGE_PREFIX:-ghcr.io/edcastanohunter/petpassport}-backend:${PP_VERSION:?PP_VERSION}
    entrypoint: ["/migrate", "up"]
    environment:
      PP_DB_URL: ${PP_MIGRATOR_DB_URL:?PP_MIGRATOR_DB_URL}
    read_only: true
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]
    networks: [internal]
    restart: "no"
    profiles: [oneshot]

  keycloak:
    image: quay.io/keycloak/keycloak:26.1
    <<: *hardening
    # Keycloak escribe en /opt/keycloak/data (caché de temas, tmp).
    read_only: false
    command: ["start", "--http-port=8080", "--metrics-enabled=true", "--health-enabled=true"]
    environment:
      KC_DB: postgres
      KC_DB_URL: ${KC_DB_URL:?KC_DB_URL}
      KC_DB_USERNAME: ${KC_DB_USERNAME:-keycloak}
      KC_DB_PASSWORD: ${KC_DB_PASSWORD:?KC_DB_PASSWORD}
      KC_HOSTNAME: https://auth.${PP_DOMAIN}
      KC_HOSTNAME_BACKCHANNEL_DYNAMIC: "true"
      KC_PROXY_HEADERS: xforwarded
      KC_HTTP_ENABLED: "true"
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KC_ADMIN_USER:?KC_ADMIN_USER}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KC_ADMIN_PASSWORD:?KC_ADMIN_PASSWORD}
    networks: [edge, internal, default]
    healthcheck:
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/127.0.0.1/9000 && echo -e 'GET /health/ready HTTP/1.1\\r\\nHost: localhost\\r\\n\\r\\n' >&3 && grep -q '\"status\": \"UP\"' <&3"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 60s

  keycloak-config:
    image: adorsys/keycloak-config-cli:latest-26
    environment:
      KEYCLOAK_URL: http://keycloak:8080
      KEYCLOAK_USER: ${KC_ADMIN_USER}
      KEYCLOAK_PASSWORD: ${KC_ADMIN_PASSWORD}
      KEYCLOAK_AVAILABILITYCHECK_ENABLED: "true"
      KEYCLOAK_AVAILABILITYCHECK_TIMEOUT: 180s
      IMPORT_FILES_LOCATIONS: /config/realm.yaml
      IMPORT_VARSUBSTITUTION_ENABLED: "true"
      IMPORT_MANAGED_CLIENT: full
      IMPORT_MANAGED_ROLE: full
      PP_WEB_ORIGIN: https://app.${PP_DOMAIN}
      # Sin origen de desarrollo en staging: se repite el de la app.
      PP_WEB_ORIGIN_DEV: https://app.${PP_DOMAIN}
      PP_BACKEND_CLIENT_SECRET: ${PP_BACKEND_CLIENT_SECRET}
      PP_SMTP_HOST: ${PP_SMTP_HOST}
      PP_SMTP_PORT: ${PP_SMTP_PORT:-587}
      PP_SMTP_FROM: ${PP_SMTP_FROM:-no-reply@${PP_DOMAIN}}
    volumes:
      - ../keycloak:/config:ro
    security_opt: ["no-new-privileges:true"]
    networks: [internal]
    restart: "no"
    profiles: [oneshot]

  api:
    image: ${IMAGE_PREFIX:-ghcr.io/edcastanohunter/petpassport}-backend:${PP_VERSION:?PP_VERSION}
    <<: *hardening
    environment:
      <<: *api-env
      PP_HTTP_ADDR: ":8080"
      PP_INTERNAL_ADDR: ":9090"
    networks: [edge, internal, default]
    healthcheck:
      # Imagen distroless: el propio binario consulta /readyz (cmd/api/healthcheck.go).
      test: ["CMD", "/api", "healthcheck"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s
    stop_grace_period: 30s

  frontend:
    image: ${IMAGE_PREFIX:-ghcr.io/edcastanohunter/petpassport}-frontend:${PP_VERSION:?PP_VERSION}
    <<: *hardening
    tmpfs: [/tmp, /var/cache/nginx]
    volumes:
      - ${PP_STATE_DIR}/config.json:/usr/share/nginx/html/config.json:ro
    networks: [edge]
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:8080/config.json"]
      interval: 10s
      timeout: 3s
      retries: 6

networks:
  # edge: Traefik ↔ servicios publicados. internal: api/keycloak ↔ one-shots.
  # default: observabilidad (docker-compose.observability.yml) ↔ api/keycloak/traefik.
  edge: {}
  internal: {}
  default: {}

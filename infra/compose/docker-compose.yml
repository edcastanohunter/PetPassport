# Entorno de desarrollo (docs/phase-1/09 §2). Uso: `make dev-up` desde la raíz.
# Hosts: https://app.pp.localhost · https://api.pp.localhost · https://auth.pp.localhost
name: petpassport

x-pg-env: &pg-env
  POSTGRES_USER: postgres
  POSTGRES_PASSWORD: ${PG_SUPERUSER_PASSWORD:-postgres}

services:
  traefik:
    image: traefik:v3.3
    command:
      - --providers.file.directory=/etc/traefik/dynamic
      - --providers.file.watch=true
      - --entrypoints.web.address=:80
      - --entrypoints.web.http.redirections.entrypoint.to=websecure
      - --entrypoints.web.http.redirections.entrypoint.scheme=https
      - --entrypoints.websecure.address=:443
      - --entrypoints.websecure.transport.respondingTimeouts.readTimeout=30s
      - --entrypoints.websecure.transport.respondingTimeouts.writeTimeout=60s
      - --entrypoints.websecure.transport.respondingTimeouts.idleTimeout=180s
      - --api.dashboard=true
      - --api.insecure=true
      - --metrics.prometheus=true
      - --log.level=INFO
      - --accesslog=true
      - --accesslog.fields.headers.names.Authorization=drop
    ports:
      - "80:80"
      - "443:443"
      - "8081:8080" # dashboard (solo dev)
    volumes:
      - ../traefik/dynamic:/etc/traefik/dynamic:ro
      - ../traefik/certs:/etc/traefik/certs:ro
    depends_on:
      - api
      - frontend
      - keycloak

  postgres:
    image: postgres:17-alpine
    environment:
      <<: *pg-env
      POSTGRES_DB: petpassport
      PP_API_PASSWORD: ${PP_API_PASSWORD:-api}
      PP_MIGRATOR_PASSWORD: ${PP_MIGRATOR_PASSWORD:-migrator}
      KC_DB_PASSWORD: ${KC_DB_PASSWORD:-keycloak}
    command: ["postgres", "-c", "shared_preload_libraries=pg_stat_statements", "-c", "log_min_duration_statement=200"]
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ../postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d petpassport"]
      interval: 5s
      timeout: 3s
      retries: 20

  migrate:
    build:
      context: ../../backend
    entrypoint: ["/migrate", "up"]
    environment:
      PP_DB_URL: postgres://petpassport_migrator:${PP_MIGRATOR_PASSWORD:-migrator}@postgres:5432/petpassport?sslmode=disable
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  keycloak:
    image: quay.io/keycloak/keycloak:26.1
    command: ["start-dev", "--http-port=8080", "--metrics-enabled=true", "--health-enabled=true"]
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: ${KC_DB_PASSWORD:-keycloak}
      KC_HOSTNAME: https://auth.pp.localhost
      KC_HOSTNAME_STRICT: "false"
      # La API descubre el realm por la red interna (http://keycloak:8080) mientras
      # los tokens llevan iss=https://auth.pp.localhost (PP_OIDC_DISCOVERY_URL).
      KC_HOSTNAME_BACKCHANNEL_DYNAMIC: "true"
      KC_PROXY_HEADERS: xforwarded
      KC_HTTP_ENABLED: "true"
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KC_ADMIN_USER:-admin}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KC_ADMIN_PASSWORD:-admin}
    ports:
      - "8180:8080" # Admin API para scripts locales (dev-seed); en staging/prod solo vía Traefik
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      # La imagen no incluye curl; el health endpoint vive en el puerto de gestión 9000.
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/127.0.0.1/9000 && echo -e 'GET /health/ready HTTP/1.1\\r\\nHost: localhost\\r\\n\\r\\n' >&3 && grep -q '\"status\": \"UP\"' <&3"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 40s

  keycloak-config:
    # Aplica infra/keycloak/realm.yaml de forma idempotente (PP-F1-IAM-001).
    image: adorsys/keycloak-config-cli:latest-26
    environment:
      KEYCLOAK_URL: http://keycloak:8080
      KEYCLOAK_USER: ${KC_ADMIN_USER:-admin}
      KEYCLOAK_PASSWORD: ${KC_ADMIN_PASSWORD:-admin}
      KEYCLOAK_AVAILABILITYCHECK_ENABLED: "true"
      KEYCLOAK_AVAILABILITYCHECK_TIMEOUT: 120s
      IMPORT_FILES_LOCATIONS: /config/realm.yaml
      IMPORT_VARSUBSTITUTION_ENABLED: "true"
      IMPORT_MANAGED_CLIENT: full
      IMPORT_MANAGED_ROLE: full
      PP_WEB_ORIGIN: https://app.pp.localhost
      PP_WEB_ORIGIN_DEV: http://localhost:5173
      PP_BACKEND_CLIENT_SECRET: ${PP_BACKEND_CLIENT_SECRET:-dev-backend-secret-change-me}
      PP_SMTP_HOST: mailpit
      PP_SMTP_PORT: "1025"
      PP_SMTP_FROM: no-reply@petpassport.local
    volumes:
      - ../keycloak:/config:ro
    depends_on:
      keycloak:
        condition: service_healthy
    restart: "no"

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minio}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minio12345}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - miniodata:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 3s
      retries: 20

  minio-init:
    image: minio/mc:latest
    entrypoint: ["/bin/sh", "/init.sh"]
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minio}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minio12345}
    volumes:
      - ../minio/init.sh:/init.sh:ro
    depends_on:
      minio:
        condition: service_healthy
    restart: "no"

  mailpit:
    image: axllent/mailpit:latest
    ports:
      - "8025:8025"
      - "1025:1025"
    environment:
      MP_SMTP_AUTH_ACCEPT_ANY: "1"
      MP_SMTP_AUTH_ALLOW_INSECURE: "1"

  api:
    image: ghcr.io/air-verse/air:latest
    working_dir: /src
    command: ["-c", ".air.toml"]
    environment:
      PP_ENV: dev
      PP_HTTP_ADDR: ":8080"
      PP_INTERNAL_ADDR: ":9090"
      PP_DB_URL: postgres://petpassport_api:${PP_API_PASSWORD:-api}@postgres:5432/petpassport?sslmode=disable
      PP_DB_MAX_CONNS: "10"
      PP_OIDC_ISSUER: https://auth.pp.localhost/realms/petpassport
      PP_OIDC_DISCOVERY_URL: http://keycloak:8080/realms/petpassport
      PP_OIDC_AUDIENCE: petpassport-api
      PP_OIDC_ALLOWED_AZP: petpassport-web
      PP_IP_HASH_SALT: ${PP_IP_HASH_SALT:-dev-ip-hash-salt-change-me}
      PP_KC_ADMIN_CLIENT_ID: petpassport-backend
      PP_KC_ADMIN_CLIENT_SECRET: ${PP_BACKEND_CLIENT_SECRET:-dev-backend-secret-change-me}
      PP_STORAGE_ENDPOINT: minio:9000
      PP_STORAGE_BUCKET: petpassport-media
      PP_STORAGE_ACCESS_KEY: ${MINIO_ROOT_USER:-minio}
      PP_STORAGE_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-minio12345}
      PP_SMTP_HOST: mailpit
      PP_SMTP_PORT: "1025"
      PP_CORS_ORIGINS: https://app.pp.localhost,http://localhost:5173
      PP_LOG_LEVEL: debug
      PP_PUBLIC_BASE_URL: https://app.pp.localhost
      GOFLAGS: -buildvcs=false
    volumes:
      - ../../backend:/src
      - gomod:/go/pkg/mod
      - gocache:/root/.cache/go-build
    ports:
      - "9090:9090" # /metrics, /readyz, pprof (solo dev)
    depends_on:
      migrate:
        condition: service_completed_successfully
      keycloak-config:
        condition: service_completed_successfully

  frontend:
    image: node:22-alpine
    working_dir: /src
    command: ["sh", "-c", "npm install --no-audit --no-fund && npm run gen:api && npm run dev"]
    environment:
      CHOKIDAR_USEPOLLING: "true"
    volumes:
      - ../../frontend:/src
      - ../../backend/api/openapi.yaml:/backend/api/openapi.yaml:ro
      - nodemodules:/src/node_modules
    ports:
      - "5173:5173"

volumes:
  pgdata:
  miniodata:
  gomod:
  gocache:
  nodemodules:

# PetPassport Egress Proxy Configuration (Squid) (PP-F4-INF-002, ARQ-006, SEC-004)
# Solo permite conexiones a los destinos autorizados en allowlist.yaml y bloquea rangos privados / metadata.

http_port 3128

# Bloqueo estricto anti-SSRF para rangos privados y metadata
acl local_net src 10.0.0.0/8
acl local_net src 172.16.0.0/12
acl local_net src 192.168.0.0/16
acl local_net src 127.0.0.0/8
acl local_net src fc00::/7
acl local_net src fe80::/10

acl cloud_metadata dst 169.254.169.254
acl private_dest dst 10.0.0.0/8
acl private_dest dst 172.16.0.0/12
acl private_dest dst 192.168.0.0/16
acl private_dest dst 127.0.0.0/8

http_access deny cloud_metadata
http_access deny private_dest

# Puertos seguros permitidos (SSL/HTTPS)
acl SSL_ports port 443
acl SSL_ports port 8443
acl Safe_ports port 443
acl Safe_ports port 8443
acl CONNECT method CONNECT

http_access deny !Safe_ports
http_access deny CONNECT !SSL_ports

# Lista blanca de dominios permitidos
acl allowed_domains dstdomain .anthropic.com
acl allowed_domains dstdomain .petpassport.local
acl allowed_domains dstdomain sandbox.partner-pharmacy.example.com
# Proveedor de pagos (PP-F5-ARQ-002)
acl allowed_domains dstdomain production.wompi.co
acl allowed_domains dstdomain sandbox.wompi.co

http_access allow allowed_domains
http_access deny all

# Formato de log con latencia, destino y código de respuesta (INF-002)
logformat egress_log %{%Y-%m-%d %H:%M:%S}tg %>a %[ui %[un [%tl] "%rm %ru HTTP/%rv" %>Hs %<st %tr
access_log /var/log/squid/egress_access.log egress_log

# Allowlist de destinos salientes para PetPassport Egress Proxy (PP-F4-INF-002, ARQ-006, SEC-004)
# Mantenido y sincronizado automáticamente hacia el proxy saliente (Squid / Envoy).
version: "1.0"
updated_at: "2026-11-09T00:00:00Z"

# Proveedores de IA y servicios centrales
core_services:
  - host: "api.anthropic.com"
    description: "API de Claude (OCR y extracción de recetas médicas)"
    ports: [443]
    allowed_methods: ["POST"]
  - host: "auth.petpassport.local"
    description: "Keycloak IAM interno"
    ports: [8080, 8443]
    allowed_methods: ["GET", "POST"]

# Proveedores de pago (PP-F5-ARQ-002, SEC-001). El host efectivo es el de PP_WOMPI_BASE_URL.
payment_providers:
  - host: "production.wompi.co"
    description: "Wompi: cobro recurrente con método tokenizado, reembolsos y consulta de transacciones"
    ports: [443]
    allowed_methods: ["GET", "POST"]
  - host: "sandbox.wompi.co"
    description: "Wompi sandbox (nunca en prod: la configuración lo rechaza)"
    ports: [443]
    allowed_methods: ["GET", "POST"]

# Dominios autorizados para webhooks salientes hacia partners (sincronizados desde read_partnernetwork.partner_integrations)
partner_webhooks:
  - domain: "*.petpassport.local"
    description: "Entornos locales y simuladores de partner para CI/CD y Sandbox"
    ports: [443, 8443]
  - domain: "sandbox.partner-pharmacy.example.com"
    description: "Farmacia piloto de prueba para entorno sandbox"
    ports: [443]

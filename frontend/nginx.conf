# SPA: index.html sin caché; assets con hash inmutables (docs/phase-1/07 §9).
#
# Las cabeceras se fijan solo a nivel de server: en nginx, un add_header dentro
# de un location anula TODOS los heredados, así que Cache-Control y la CSP se
# eligen por URI con map en lugar de repetirse por location.

map $request_uri $pp_cache_control {
    default        "no-cache";
    ~^/assets/     "public, max-age=31536000, immutable";
}

# CSP de la SPA (PP-F1-SEC-003). style-src 'unsafe-inline' es necesario para
# los estilos inyectados por PrimeVue (documentado en 07 §7). Solo la página de
# facturación admite el widget del proveedor de pagos (PP-F5-SEC-001): el SPA
# entra en ella con carga completa para que rija esta política.
map $request_uri $pp_csp {
    default "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https:; font-src 'self' data:; connect-src 'self' https:; frame-ancestors 'none'; base-uri 'self'; form-action 'self' https:; object-src 'none'; upgrade-insecure-requests";
    "~^/org/[^/?#]+/settings/billing/?(\?.*)?$" "default-src 'self'; script-src 'self' https://checkout.wompi.co; frame-src https://checkout.wompi.co; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https:; font-src 'self' data:; connect-src 'self' https:; frame-ancestors 'none'; base-uri 'self'; form-action 'self' https:; object-src 'none'; upgrade-insecure-requests";
}

server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Traefik/WAF las repite; aquí quedan como defensa en profundidad.
    add_header Content-Security-Policy $pp_csp always;
    add_header Cache-Control $pp_cache_control always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header X-Frame-Options DENY always;
    add_header Permissions-Policy "camera=(self), microphone=(), geolocation=()" always;
    add_header Cross-Origin-Opener-Policy same-origin always;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    location /config.json {
        try_files $uri =404;
    }

    location /assets/ {
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
